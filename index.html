<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>มุ่ยเฟย</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   มุ่ยเฟย  Ver.15 — โลโก้หมูสูบซิการ์ + กราฟ 7 วัน + พื้นโทน Sofascore
   (Ver.14 เดิม: โลโก้หมู-เฟย + การ์ดเงินแบบบัตร + กราฟรับ-จ่ายวิ่งไล่ + เมนู + ไล่โผล่
   กติกาที่ยกมาจากงาน Onion ที่ผ่านการแก้มาหลายรอบแล้ว
   1. ไล่เฉดสีห้ามอยู่บนของที่กดได้  ปุ่ม/แท็บ/แถบ = สีทึบสีเดียว
      ไล่เฉดใช้ได้ที่เดียวคือ "ภาพ" บนการ์ดยอดเงิน  (Onion Ver.287)
   2. การ์ดไม่มีเส้นขอบ  แยกตัวจากพื้นด้วยเงาอ่อน  (Onion Ver.271 จาก Grab)
   3. ไม่มีอีโมจิ  ไม่มีเลข ①②③ นำหัวข้อ  (Onion Ver.282/290)
   4. เขียว = เงินเข้า  แดง = เงินออก  เท่านั้น  สีหมวดคนละชุด  (Onion Ver.287)
   5. สีตัวอักษรบนพื้นสี คำนวณด้วยค่าคอนทราสต์จริง ไม่เดาจากความสว่าง  (Onion Ver.274)
   ========================================================== */
:root{
  --accent:#3FA7E8;        /* สีธีมที่เลือก ใช้กับจุด ชิป เส้นเน้น */
  --fill:#1B7FC0;          /* สีทึบสำหรับปุ่ม คำนวณให้ตัวอักษรขาวผ่าน 4.5:1 เสมอ */
  --on-fill:#FFFFFF;
  --tint:#E8F3FB;          /* พื้นอ่อนของสีธีม */
  --m0:#1E6FA8;--m1:#3FA7E8;--m2:#57C8D6;--m3:#7FB9F0;  /* สีของภาพบนการ์ดยอดเงิน */

  --bg:#F3F5F8;
  --card:#FFFFFF;
  --card2:#F6F8FA;
  --line:#EBEEF2;
  --line2:#DCE0E7;
  --ink:#171A22;
  --ink2:#5A6172;
  --ink3:#959CAC;

  --in:#0E8A5F;  --in-tint:#E4F3EC;
  --out:#C7453A; --out-tint:#FBEAE8;

  --r-tile:18px; --r-card:14px; --r-ctl:12px; --r-sheet:24px;
  --sh1:0 1px 2px rgba(23,26,34,.05);
  --sh2:0 1px 3px rgba(23,26,34,.06), 0 6px 18px -12px rgba(23,26,34,.34);
  --sh3:0 10px 26px -12px rgba(23,26,34,.42);
  --sb:env(safe-area-inset-bottom,0px);
  --ez:cubic-bezier(.22,.9,.28,1);
  --pad:14px;
}
body.dark{
  --bg:#101319; --card:#191D26; --card2:#20252F;
  --line:#262B36; --line2:#333945;
  --ink:#EDEFF4; --ink2:#A2A9B8; --ink3:#727A8B;
  --tint:#1B2733; --in-tint:#12291F; --out-tint:#2E1A19;
  --sh1:0 1px 2px rgba(0,0,0,.3);
  --sh2:0 1px 3px rgba(0,0,0,.35), 0 6px 18px -12px rgba(0,0,0,.8);
  --sh3:0 10px 26px -12px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(108px + var(--sb));
  transition:background .2s,color .2s;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:"Kanit",sans-serif;font-variant-numeric:tabular-nums}
.hide{display:none !important}
.tap{transition:transform .13s var(--ez)}
.tap:active{transform:scale(.95)}

/* ---------- หัวจอ ---------- */
.top{position:sticky;top:0;z-index:20;padding:10px var(--pad) 0;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(150%) blur(14px);-webkit-backdrop-filter:saturate(150%) blur(14px)}
@supports not (backdrop-filter:blur(1px)){.top{background:var(--bg)}}
.trow{display:flex;align-items:center;gap:10px;min-height:42px}
.mark{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--fill)}
.mark span{font-family:"Kanit",sans-serif;font-size:18px;font-weight:600;color:var(--on-fill);line-height:1;margin-top:1px}
/* Ver.14: โลโก้ — หมูลายเส้น (ปีหมู) ทับบนอักษรจีน 妃 (เฟย) ที่จางอยู่ข้างหลัง
   ถ้าเครื่องไหนไม่มีฟอนต์จีน ตัวอักษรจะไม่ขึ้น แต่หมูยังอยู่ครบ โลโก้จึงไม่พัง */
.mark{overflow:hidden;position:relative}
.mkicon{width:82%;height:82%;color:var(--on-fill);display:block}
.mkfei{font-family:"Noto Serif SC","Noto Sans SC","Songti SC","SimSun",serif;
  font-size:13px;fill:var(--on-fill);opacity:.6}
.first .mkicon{width:78%;height:78%}
.brand{min-width:0}
.brand b{display:block;font-family:"Kanit",sans-serif;font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.015em}
.brand i{display:block;font-style:normal;font-size:11px;color:var(--ink3);margin-top:-1px}
.bk{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--ink2);border-radius:999px;padding:6px 11px;
  background:var(--card);box-shadow:var(--sh1)}
.bk.old{color:#8A5A00;background:#FFF3D6}
body.dark .bk.old{color:#F0C878;background:#3A2E10}
.tabs{display:flex;gap:3px;padding:11px 0 8px;background:transparent}
.tabs-in{display:flex;gap:3px;background:var(--card2);border-radius:13px;padding:3px;width:100%}
.tab{flex:1;font-size:13.5px;font-weight:500;color:var(--ink2);padding:8px 0;border-radius:10px;text-align:center;
  transition:.18s var(--ez)}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--sh1)}
.page{padding:0 var(--pad)}
.page.off{display:none}

/* ---------- เบนโตะ ---------- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.tile{background:var(--card);border-radius:var(--r-tile);box-shadow:var(--sh2);padding:12px 13px}
.tile.wide{grid-column:1 / -1}
.tk{font-size:11px;color:var(--ink3);letter-spacing:.01em}
.tv{font-family:"Kanit",sans-serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:3px}
.tv.i{color:var(--in)}
.tv.o{color:var(--out)}
.tsub{font-size:11px;color:var(--ink3);margin-top:1px}

/* การ์ดยอดเงิน — ที่เดียวในแอปที่ใช้ภาพไล่เฉด */
.hero{position:relative;overflow:hidden;border-radius:var(--r-tile);padding:17px 17px 15px;
  background:
    radial-gradient(115% 85% at 8% 4%, var(--m1) 0%, transparent 58%),
    radial-gradient(95% 80% at 92% 12%, var(--m2) 0%, transparent 62%),
    radial-gradient(120% 95% at 62% 108%, var(--m3) 0%, transparent 66%),
    var(--m0);
  box-shadow:var(--sh2)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 58% at 82% 92%, rgba(255,255,255,.20) 0%, transparent 70%),
             linear-gradient(160deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.05) 42%, transparent 70%)}
.hero .lb{font-size:12px;color:rgba(255,255,255,.95);position:relative;z-index:1}
.hero .amt{font-family:"Kanit",sans-serif;font-weight:600;font-size:37px;line-height:1.14;color:#fff;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;position:relative;z-index:1;margin-top:2px}
.hero .amt .bt{font-size:19px;font-weight:400;opacity:.62;margin-right:4px}
.hero .foot{position:relative;z-index:1;margin-top:9px;font-size:11.5px;color:rgba(255,255,255,.9)}
.streak{font-size:11.5px;color:var(--ink3);padding:0 4px 8px}

/* ---------- การ์ดทั่วไป ---------- */
.card{background:var(--card);border-radius:var(--r-tile);box-shadow:var(--sh2);padding:15px;margin-bottom:9px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.ct h2{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ct .sub{font-size:11.5px;color:var(--ink3)}
.sechd{display:flex;align-items:baseline;justify-content:space-between;padding:8px 4px 7px}
.sechd h2{margin:0;font-size:14.5px;font-weight:600}
.sechd .sub{font-size:11.5px;color:var(--ink3)}

/* ---------- ชิป ---------- */
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chiprow::-webkit-scrollbar{display:none}
.chipwrap{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:0 0 auto;white-space:nowrap;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;
  color:var(--ink2);background:var(--card2);display:inline-flex;align-items:center;gap:6px;
  transition:transform .13s var(--ez),background .16s,color .16s}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--fill);color:var(--on-fill)}
.chip.sm{font-size:12px;padding:6px 11px}
.dot{width:7px;height:7px;border-radius:99px;flex:0 0 7px}
.chip.on .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.65)}

/* ---------- กราฟ ---------- */
.bars{display:flex;align-items:flex-end;height:148px;margin-top:9px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.numwrap{height:13px;display:flex;align-items:flex-end;justify-content:center}
.bnum{font-family:"Kanit",sans-serif;font-size:9px;line-height:1;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.bcol.sel .bnum{color:var(--ink);font-weight:600}
.bpair{display:flex;align-items:flex-end;gap:3px;height:100px;width:100%;justify-content:center}
.bar{flex:0 0 11px;width:11px;border-radius:5px 5px 3px 3px;height:0;transition:height .55s var(--ez)}
.bar.i{background:var(--in)}
.bar.o{background:var(--out)}
.bar.bmark{flex:0 0 6px;width:6px}
.bar.z{background:var(--line);height:4px !important;border-radius:99px}
.bcol.sel .bar{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint)}
.blab{font-size:10px;color:var(--ink3)}
.bcol.sel .blab{color:var(--ink);font-weight:600}
.readout{display:flex;align-items:baseline;gap:11px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);min-height:30px;flex-wrap:wrap}
.readout .rl{font-size:11.5px;color:var(--ink2)}
.readout .rv{font-family:"Kanit",sans-serif;font-size:14.5px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:11px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.legend>span:last-child{flex-basis:100%;line-height:1.6;color:var(--ink3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- สรุปเดือน ---------- */
.headline{font-size:14px;line-height:1.6;margin-bottom:12px;color:var(--ink2)}
.headline b{font-weight:600;color:var(--ink)}
.headline .big{font-family:"Kanit",sans-serif;font-size:21px;font-weight:600;letter-spacing:-.02em}
.donutwrap{display:flex;gap:15px;align-items:center}
.donut{flex:0 0 102px;position:relative}
.donut svg{transform:rotate(-90deg);display:block}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .m1{font-size:10px;color:var(--ink3)}
.donut .m2{font-family:"Kanit",sans-serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.catlist{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:8px;padding:4px 0}
.cnm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpc{font-family:"Kanit",sans-serif;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- รายการ: การ์ดใบเดียว แถวคั่นด้วยเส้น ---------- */
.daygrp{background:var(--card);border-radius:var(--r-tile);box-shadow:var(--sh2);overflow:hidden;margin-bottom:9px}
.dayhd{display:flex;align-items:baseline;justify-content:space-between;padding:11px 14px 7px;font-size:11.5px;color:var(--ink3)}
.dayhd .dn{font-family:"Kanit",sans-serif;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 14px;
  background:var(--card);border-top:1px solid var(--line);transition:background .14s}
.daygrp .line:first-of-type{border-top:0}
.line:active{background:var(--card2)}
.ico{flex:0 0 32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:"Kanit",sans-serif;font-size:14px;font-weight:500}
.nm{flex:1;min-width:0}
.t1{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:block;font-size:11px;color:var(--ink3);margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:"Kanit",sans-serif;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.i{color:var(--in)}
.amt.o{color:var(--out)}
.line.armed{background:var(--tint);box-shadow:inset 3px 0 0 var(--fill)}
.empty{padding:22px 8px;color:var(--ink2);font-size:13.5px;line-height:1.8;text-align:center}
.empty b{color:var(--ink);font-weight:600}
.linkbtn{display:block;width:100%;text-align:center;padding:11px;font-size:13px;font-weight:600;color:var(--fill)}

.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mnav .mb{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh1);font-size:17px;color:var(--ink2)}
.mnav .mt{font-family:"Kanit",sans-serif;font-size:16.5px;font-weight:500}

/* ---------- ฟอร์ม ---------- */
.fl{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 6px 2px}
.field{margin-bottom:12px}
input[type=text],input[type=number]{
  width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:var(--r-ctl);
  padding:11px 12px;font-size:15px;transition:.16s}
input:focus{background:var(--card);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--tint)}
input::placeholder{color:var(--ink3)}
.frow{display:flex;gap:7px;align-items:center}
.frow .fn{flex:1;min-width:0}
.frow .fm{flex:0 0 116px}
.frow .fx{flex:0 0 26px;height:26px;border-radius:8px;background:var(--card2);color:var(--ink3);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.rowwrap{margin-bottom:9px}
.rowcat{display:flex;align-items:center;gap:6px;padding:6px 0 0 2px}
.rowcat .rc{font-size:11.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.rowcat .rc .dot{width:7px;height:7px}
.addrowbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;
  border-radius:var(--r-ctl);background:var(--card2);color:var(--ink2);font-size:13.5px;font-weight:500;
  transition:transform .13s var(--ez)}
.addrowbtn:active{transform:scale(.98)}
.ftot{display:flex;align-items:baseline;gap:8px;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.ftot .k{font-size:12.5px;color:var(--ink2)}
.ftot .v{margin-left:auto;font-family:"Kanit",sans-serif;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.money{position:relative}
.money .cur{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-family:"Kanit",sans-serif;font-size:16px;color:var(--ink3);pointer-events:none}
.money input{border:1.5px solid var(--line2);background:var(--card);padding:12px 13px 12px 33px;
  font-family:"Kanit",sans-serif;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.money input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.money.filled input{border-color:var(--accent)}
.money.filled .cur{color:var(--accent)}
.money.sm input{padding:11px 11px 11px 30px;font-size:17px}
.money.sm .cur{left:11px;font-size:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 15px;border-radius:var(--r-ctl);
  font-weight:600;font-size:15px;width:100%;transition:transform .13s var(--ez)}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--fill);color:var(--on-fill)}
.btn-in{background:var(--in);color:#fff}
.btn-out{background:var(--card2);color:var(--ink)}
.btn-danger{background:var(--out-tint);color:var(--out)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}

/* ---------- แถบล่าง ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:9px var(--pad) calc(9px + var(--sb));
  background:color-mix(in srgb, var(--bg) 76%, transparent);
  backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px)}
@supports not (backdrop-filter:blur(1px)){.dock{background:var(--bg)}}
.say{width:100%;height:54px;border-radius:16px;color:var(--on-fill);display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:15.5px;font-weight:600;background:var(--fill);transition:transform .13s var(--ez)}
.say:active{transform:scale(.98)}
.say.live{background:var(--out)}
.mic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.fab{position:fixed;right:calc(var(--pad) + 2px);bottom:calc(80px + var(--sb));z-index:33;width:50px;height:50px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;background:var(--fill);box-shadow:var(--sh3);
  transition:transform .2s var(--ez)}
.fab svg{stroke:var(--on-fill)}
.fab.rot{transform:rotate(45deg)}
.fab:active{transform:scale(.9)}
.fab.rot:active{transform:rotate(45deg) scale(.9)}
.dial{position:fixed;right:calc(var(--pad) + 2px);z-index:32;display:flex;align-items:center;gap:8px;
  transform:translateY(10px) scale(.94);opacity:0;pointer-events:none;transition:.2s var(--ez)}
.dial.on{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.dial .dl{font-size:13px;font-weight:500;background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;box-shadow:var(--sh2)}
.dial .db{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh3)}
.dial1{bottom:calc(142px + var(--sb))}
.dial2{bottom:calc(196px + var(--sb))}
.dialscrim{position:fixed;inset:0;z-index:31;background:rgba(16,19,25,.26);opacity:0;pointer-events:none;transition:.2s}
.dialscrim.on{opacity:1;pointer-events:auto}

/* ---------- ชีต ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,19,25,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 var(--pad) calc(14px + var(--sb));transform:translateY(103%);
  transition:transform .34s cubic-bezier(.22,1.02,.32,1);max-height:86vh;overflow:auto;overscroll-behavior:contain;
  box-shadow:0 -10px 40px -14px rgba(16,19,25,.45)}

    linear-gradient(to right,transparent 11px,rgba(120,90,30,.30) 11px,rgba(120,90,30,.30) 12px,transparent 12px),
    linear-gradient(140deg,#E7CE8E,#CBA85F 55%,#E0C482);
  box-shadow:inset 0 0 0 1px rgba(120,90,30,.20)}
body.dark .hero::after{opacity:.85}
.hero>*{position:relative;z-index:1}
.hero .lb{color:var(--ink2);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;

.hero .lb::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--fill)}
.hero .amt{color:var(--ink);font-size:41px;letter-spacing:-.03em;margin-top:5px}
.hero .amt .bt{color:var(--ink3);opacity:1;font-size:20px}
.hero .foot{color:var(--ink2);margin-top:8px;font-size:12px}

/* ---------- ชิป ปุ่ม ช่องกรอก ---------- */
.chip{background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.chip.on{background:var(--fill);border-color:transparent;color:var(--on-fill)}
.seg,.tabs-in,.bask,.cal{background:var(--card2);border:1px solid var(--line)}
.seg button.on{background:#fff}
body.dark .seg button.on{background:#2C3348}
.btn{border-radius:15px}
.btn-out{background:var(--card2);border:1px solid var(--line2)}
.addrowbtn,.frow .fx,.addgo,.shx,.shback,.qpin{background:var(--card2)}
input[type=text],input[type=number]{background:var(--card2);border:1.5px solid var(--line)}
input:focus{background:var(--glass);border-color:var(--accent)}
.money input{background:var(--glass);border-color:var(--line2)}
.money.filled input{border-color:var(--accent)}
.si{background:var(--card2)}
.mb,.cal-h button{background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh1)}

/* ---------- ตัวเลือกแบบดรอปดาวน์ (แทนแถวชิป 2 แถวบนกราฟ) ----------
   สองแถวชิปเดิมกิน 79px ก่อนจะเห็นกราฟสักแท่ง แถวนี้เหลือ 34px */
.selrow{display:flex;gap:8px;margin-bottom:10px}
.msel{position:relative;flex:1;min-width:0}
.mselb{width:100%;height:34px;border-radius:11px;padding:0 10px;
  background:var(--card2);border:1px solid var(--line);color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-size:13px;font-family:inherit;transition:transform .12s var(--ez)}
.mselb:active{transform:scale(.97)}
.mselb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mselb svg{flex:0 0 12px;width:12px;height:12px;fill:none;stroke:var(--ink3);
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s var(--ez)}
.msel.open .mselb{border-color:var(--accent)}
.msel.open .mselb svg{transform:rotate(180deg)}
.mselm{position:absolute;top:38px;left:0;right:0;z-index:14;display:none;padding:5px;
  background:var(--glass);border-radius:13px;box-shadow:var(--sh3);border:1px solid var(--line)}
.msel.open .mselm{display:block}
.mseli{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;
  font-size:13.5px;font-family:inherit;color:var(--ink2);background:transparent}
.mseli.on{background:var(--tint);color:var(--fill);font-weight:600}
.mseli:active{background:var(--card2)}

/* ---------- กราฟ: ลดพื้นที่ที่ไม่ได้ใช้ ----------
   เดิม แถวชิป 2 แถว 79px + แท่ง 148px + คำอธิบายตกบรรทัดที่สอง
   ตอนนี้ ดรอปดาวน์ 34px + แท่ง 124px + คำอธิบายบรรทัดเดียว */
.bars{height:124px;margin-top:8px}
.bpair{height:84px}
.readout{margin-top:7px;padding-top:8px;min-height:0}
.legend{flex-wrap:nowrap;align-items:center;width:100%;gap:10px}
.legend>span:last-child{flex-basis:auto;margin-left:auto;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ตัวเลขบนหัวแท่ง: เอียงขึ้นซ้าย ----------
   จุดหมุนอยู่มุมขวาล่างของตัวเลข และมุมนั้นถูกตรึงไว้กลางคอลัมน์
   ตัวเลขจึงพาดขึ้นไปทางซ้ายแทนที่จะกางออกด้านข้างไปชนคอลัมน์ข้างๆ */
.bars{height:138px}
.bpair{height:74px}
.numwrap{height:40px;position:relative;display:block;width:100%;overflow:visible}
.bnum{position:absolute;right:50%;font-size:8.5px;
  transform:rotate(-55deg);transform-origin:100% 100%}
.bnum.o{bottom:1px;color:var(--ink3)}
.bnum.i{bottom:15px;color:var(--in);font-weight:500}

/* ---------- กราฟเส้นเงินคงเหลือ ---------- */
#trSel{max-width:186px}
.trwrap{position:relative;margin-top:2px}
.trsvg{display:block;width:100%;height:118px;overflow:visible}
.trfoot{display:flex;align-items:baseline;gap:8px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
/* .legend ตัวหลักถูกดัดให้ลูกตัวสุดท้ายชิดขวา (ไว้ใช้กับกราฟแท่ง)
   ในการ์ดนี้มันทำให้ "จ่าย" กระเด็นไปติดกับตัวเลขขวาสุด ต้องปลดเฉพาะที่นี่ */
.trfoot .legend{gap:12px;width:auto;flex-wrap:nowrap}
.trfoot .legend>span:last-child{margin-left:0;flex-basis:auto;text-align:left}
.trfoot .now{font-family:"Kanit",sans-serif;font-size:16px;letter-spacing:-.02em}
.trfoot .rr{margin-left:auto;font-size:11px;color:var(--ink3)}
.trax{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:4px}

/* ---------- ฟิลเตอร์หน้ารายการ ---------- */
.tfbtn{display:block;width:100%;text-align:left;font-family:inherit;
  transition:transform .12s var(--ez),box-shadow .16s}
.tfbtn:active{transform:scale(.975)}
.tfbtn.on{box-shadow:var(--sh2), inset 0 0 0 2px var(--tabc)}
.chip.on.ci{background:var(--in)}
.chip.on.co{background:var(--out)}
.chipsep{flex:0 0 1px;align-self:stretch;margin:4px 3px;background:var(--line2);border-radius:1px}

/* ---------- แถบล่างลอย ---------- */
.gnav{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--sb));z-index:30;height:62px;
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-radius:22px;
  background:var(--glass);border:1px solid var(--line);
  box-shadow:0 4px 16px -9px rgba(60,70,120,.34);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.gn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;min-width:0;
  color:var(--ink3);transition:transform .13s var(--ez),color .16s}
.gn:active{transform:scale(.9)}
.gn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.gn i{font-style:normal;font-size:9.5px;letter-spacing:.01em;white-space:nowrap}
.gn.on{color:var(--fill)}
body.dark .gn.on{color:var(--accent)}
.gn.live{color:var(--out)}
.gplus{flex:0 0 54px;height:54px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  background:var(--fill);box-shadow:0 8px 18px -7px rgba(27,127,192,.75);
  transition:transform .18s var(--ez)}
.gplus svg{width:25px;height:25px;stroke:var(--on-fill);stroke-width:2.4;fill:none;stroke-linecap:round}
/* Ver.12: หมุนเฉพาะเครื่องหมาย ไม่หมุนตัวปุ่ม — ของเดิมหมุนทั้งปุ่ม
   สี่เหลี่ยมมนเลยกลายเป็นข้าวหลามตัดตอนเมนูเปิด ดูไม่เข้ากับปุ่มกลมสองใบที่เด้งขึ้นมา */
.gplus svg{transition:transform .2s var(--ez)}
.gplus.rot svg{transform:rotate(45deg)}
.gplus:active,.gplus.rot:active{transform:scale(.9)}
.gplus.hide{display:none}
/* Ver.12: เดิม .dial เป็น flex จัดกึ่งกลางทั้งคู่ [ป้าย][ปุ่ม] ปุ่มกลมจึงเยื้องไปทางขวา
   ของกึ่งกลางจอเท่ากับครึ่งหนึ่งของความกว้างป้าย = ไม่ตรงแกนปุ่ม +
   เปลี่ยนเป็นกริด 1fr auto 1fr ปุ่มกลมอยู่ช่องกลางเสมอ ป้ายดันชิดขวาในช่องซ้าย
   ระยะแนวตั้ง: จุดกึ่งกลางปุ่ม + อยู่ที่ 45px จากขอบล่าง ปุ่มกลม 48px
   จึงตั้ง bottom = 45+62-24 = 83 และ 45+124-24 = 145 ให้ห่างเท่ากันช่องละ 62px */
.dial{left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.dial>.dl{justify-self:end;margin-right:8px}
.dial>.db{justify-self:center}
.dial1{bottom:calc(83px + var(--sb))}
.dial2{bottom:calc(145px + var(--sb))}
.dial3{bottom:calc(207px + var(--sb))}
/* Ver.14: ให้ไล่โผล่ทีละใบจากล่างขึ้นบน แทนที่จะเด้งพร้อมกันทั้งชุด
   ตอนปิดไล่กลับทางลง ใบบนสุดหุบก่อน ปุ่มจึงดูเหมือนหุบกลับเข้าไปในปุ่ม + */
.dial{transition:transform .22s var(--ez), opacity .18s var(--ez);
  transform:translateY(16px) scale(.9)}
/* เปิด: ไล่จากใบล่างขึ้นบน (.on ชนะเพราะ specificity สูงกว่า) */
.dial1.on{transition-delay:0ms}
.dial2.on{transition-delay:60ms}
.dial3.on{transition-delay:120ms}
/* ปิด: ไล่กลับทางลง ใบบนสุดหุบก่อน เหมือนหดกลับเข้าปุ่ม + */
.dial3{transition-delay:0ms}
.dial2{transition-delay:60ms}
.dial1{transition-delay:120ms}
.dial .dl{transition:opacity .16s var(--ez);opacity:0}
.dial.on .dl{opacity:1;transition-delay:inherit}
.dial .db{width:48px;height:48px;border-radius:16px}
.dial .dl{background:var(--glass);border:1px solid var(--line);
  backdrop-filter:none;-webkit-backdrop-filter:none}
.toast{bottom:calc(96px + var(--sb))}

/* ---------- ชีต ---------- */
.sheet{background:var(--glass);backdrop-filter:none;-webkit-backdrop-filter:none;
  border-top:0;box-shadow:0 -8px 26px -14px rgba(40,50,90,.34)}
.shhead{background:var(--glass);backdrop-filter:none;-webkit-backdrop-filter:none}
.stick{background:linear-gradient(180deg,rgba(255,255,255,0),var(--glass) 26%)}
body.dark .stick{background:linear-gradient(180deg,rgba(28,33,48,0),var(--glass) 26%)}

/* ---------- จอแรกสุด ---------- */
.first{background:
  radial-gradient(88% 62% at 2% 0%,   #DBEBF8 0%, rgba(219,235,248,0) 66%),
  radial-gradient(80% 56% at 100% 3%, #C8EEE6 0%, rgba(200,238,230,0) 62%),
  radial-gradient(92% 66% at 0% 100%, #C9D6F9 0%, rgba(201,214,249,0) 68%),
  radial-gradient(84% 58% at 100% 98%,#DCD4FB 0%, rgba(220,212,251,0) 64%),
  #E4EDF9}
body.dark .first{background:#141726}

</style>

<style id="skin15">
/* ============================================================
   Ver.15 — พื้นหลังโทน Sofascore · กราฟแท่ง 7 วัน ตัวเลขเกาะหัวแท่ง · โลโก้หมูสูบซิการ์
   ลบทั้งบล็อกนี้แล้วหน้าตาจะกลับไปเป็น Ver.14 (ยกเว้นตัวเลขบนกราฟกับโลโก้ ซึ่งแก้ที่ตัวมาร์กอัป)
   ============================================================ */

/* ---------- พื้นหลัง: วัดจากสกรีนช็อต Sofascore แล้วปรับความเข้ม ----------
   พื้นของ Sofascore จริงคือ #EDF0F5 (hue 218) — สวย แต่ต่างจากการ์ดขาวแค่ 1.14 เท่า
   ซึ่งคือปัญหา "พื้นหลังกลืนกับกรอบขาว" ที่เพิ่งแก้ไปรอบที่แล้วเป๊ะๆ
   จึงเอา "โทน" ของเขามา (เทาอมน้ำเงิน hue 218 เท่ากัน) แต่คุมความเข้มไว้ที่ 1.25 เท่า
   เท่ากับ #DCE7EC ของ Ver.14 ที่ผ่านตาแล้ว — การ์ดขาวจึงยังลอยออกมาชัด */
body{background:#E1E6EF}
.wall{background:#E1E6EF}
body.dark, body.dark .wall{background:#141B24}
/* หมายเหตุ: applyTheme() เซ็ต --bg ลงบน :root แบบอินไลน์ การเขียนทับที่ตัวแปรจึงไม่ชนะ ต้องเขียนทับที่ body ตรงๆ */

/* ---------- กราฟแท่ง: 7 วัน + ตัวเลขเกาะหัวแท่งจริง ----------
   ของเดิม (Ver.13/14) ตัวเลขอยู่ในแถบ .numwrap สูง 40px ที่ยอดกราฟ ตำแหน่งตายตัว
   แท่งเตี้ยๆ ตัวเลขจึงลอยห่างจากหัวแท่งครึ่งจอ และต้องเอียง 55 องศาเพื่อไม่ให้ชนกัน
   ตอนนี้ตัวเลขอยู่ "ใน" ตัวแท่ง เกาะขอบบนด้วย bottom:100% จึงเลื่อนตามความสูงเสมอ
   7 คอลัมน์ทำให้ช่องกว้าง ~43px (เดิม 14 วัน = 21px) วางแนวนอนสองเลขได้พอดี */
.numwrap{display:none}
.bars{height:132px;overflow:visible}
.bpair{height:96px;gap:4px;overflow:visible}
.bar{flex:0 0 14px;width:14px;position:relative;border-radius:6px 6px 3px 3px}
/* แท่งรับเคยแคบกว่า (6px) ตั้งแต่สมัยที่สเกลสองสีไม่เท่ากัน ตอนนี้สเกลเดียวกันแล้ว
   และรูปตัวอย่างที่เขาส่งมาเป็นแท่งคู่กว้างเท่ากัน จึงให้เท่ากัน */
.bar.bmark{flex:0 0 14px;width:14px}
.bnum{position:absolute;right:auto;left:50%;bottom:100%;margin-bottom:3px;
  font-size:9px;line-height:1;transform:translateX(-58%)}
.bar.o .bnum{transform:translateX(-42%)}
.bpair.one .bnum{transform:translateX(-50%)}
.bnum.i{bottom:100%;color:var(--in);font-weight:500}
.bnum.o{bottom:100%;color:var(--ink2)}
.bcol.sel .bnum{color:var(--ink);font-weight:600}
.blab{font-size:11px}

/* ---------- โลโก้: หมูสูบซิการ์ ทับอักษร 妃 ที่เป็นพื้นหลังใหญ่เต็มกรอบ ----------
   ใช้ <text> ไม่ใช่ path เพราะรูปทรงตัวอักษรต้องถูกต้องจริง และแอปนี้ใช้เครื่องเดียว
   ซึ่งพิสูจน์แล้วตั้งแต่ Ver.14 ว่าเรนเดอร์ 妃 ได้
   หัวหมูกับซิการ์ถูก "เจาะ" ด้วยสีพื้นไทล์ก่อน ตัวอักษรจึงไม่วิ่งทับหน้าหมูจนรก */
.mkicon{width:94%;height:94%}
.first .mkicon{width:90%;height:90%}
.mkfei{font-size:33px;opacity:.22;fill:var(--on-fill)}
.mkcut{color:var(--fill)}
.mkband{stroke:var(--fill)}
.mksmk{opacity:.75}
.mkember{fill:#FFC46B}
</style>
</head>

var THEMES=[
 /* Ver.9: ตัดระบบธีม 12 สีทิ้งตามที่สั่ง เหลือชุดเดียว
    ฟังก์ชันสีทั้งชุด (_fillOf/_bestFg/applyTheme) เก็บไว้ เพราะยังเป็นตัวคำนวณ

 {id:'sky', n:'ฟ้าใส', b1:'#3FA7E8', bg:'#E7EDF8'}];

/* --- คณิตศาสตร์สี: คำนวณจริง ไม่เดา (บทเรียนจาก Onion Ver.274) --- */
function _rgb(h){h=String(h).replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _hex(r,g,b){function p(x){x=Math.max(0,Math.min(255,Math.round(x)));return (x<16?'0':'')+x.toString(16);}
  return '#'+p(r)+p(g)+p(b);}
function _lum(h){var c=_rgb(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}

function _mixW(h,t){var c=_rgb(h);return _hex(c[0]+(255-c[0])*t,c[1]+(255-c[1])*t,c[2]+(255-c[2])*t);}

/* ปุ่มสีทึบต้องอ่านออกทุกธีม จึงไล่เข้มลงจนตัวอักษรขาวผ่าน 4.5:1 */
function _fillOf(h){var c=h;
  for(var i=0;i<24&&_ratio(c,'#FFFFFF')<4.5;i++)c=_mixK(c,0.07);
  return c;}
function _bestFg(bg){return _ratio(bg,'#FFFFFF')>=_ratio(bg,'#171A22')?'#FFFFFF':'#171A22';}
function _hsl(h){var c=_rgb(h),r=c[0]/255,g=c[1]/255,b=c[2]/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,H=0,S=0,L=(mx+mn)/2;
  if(d){S=L>0.5?d/(2-mx-mn):d/(mx+mn);
    H=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);H*=60;}
  return [H,S,L];}

  var C=(1-Math.abs(2*L-1))*S,X=C*(1-Math.abs((H/60)%2-1)),m=L-C/2,r,g,b;
  if(H<60){r=C;g=X;b=0;}else if(H<120){r=X;g=C;b=0;}else if(H<180){r=0;g=C;b=X;}
  else if(H<240){r=0;g=X;b=C;}else if(H<300){r=X;g=0;b=C;}else{r=C;g=0;b=X;}
  return _hex((r+m)*255,(g+m)*255,(b+m)*255);}
/* ภาพบนการ์ดยอดเงิน สร้างจากสีธีมเอง ไม่ใช่ชุดสีตายตัว
   ใช้สีเพี้ยนออกจากธีม ±40 องศา ไม่ใช่ไล่เฉดสีเดียวกัน (กติกา Onion Ver.287) */

function fmtK(n){n=Math.abs(Number(n)||0);
  if(n>=1000000)return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'k';return String(Math.round(n));}
function dkey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}

/* ================= อ่านประโยค ================= */
var TD={'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9};
var TU={'สิบ':10,'ร้อย':100,'พัน':1000,'หมื่น':10000,'แสน':100000,'ล้าน':1000000};
function thaiNum(txt){
  var tot=0,cur=0,i=0,found=false;
  while(i<txt.length){
    var hit=false;
    for(var w in TU){if(txt.substr(i,w.length)===w){
      var d=cur||1;if(w==='ล้าน'){tot=(tot+d)*1;tot=tot*1000000;cur=0;}else{tot+=d*TU[w];cur=0;}
      found=true;hit=true;i+=w.length;break;}}
    if(hit)continue;
    for(var t in TD){if(txt.substr(i,t.length)===t){cur=TD[t];found=true;hit=true;i+=t.length;break;}}
    if(hit)continue;
    i++;
  }
  if(!found)return null;
  return tot+cur;
}
function normSay(raw){return String(raw||'').replace(/[,]/g,' ').replace(/\s+/g,' ').trim();}
var LEADV=/^(?:ซื้อ|จ่าย|เสีย|ได้รับ|รับ|ได้|เอา|จด)\s*/;
var CONNECT=/\s*(?:แล้วก็|และก็|และ|กับ|อีก|ต่อด้วย|ส่วน)\s*/;
var THNUM=/((?:ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)+)\s*$/;
var CONLEAD=/^\s*(?:แล้วก็|และก็|และ|กับ|อีก|ต่อด้วย|ส่วน)\s*/;
function stripLead(x){return String(x||'').replace(CONLEAD,'').replace(LEADV,'').replace(CONLEAD,'').trim();}
/* กติกาเดียวที่ใช้แยกราคาออกจากชื่อ: ราคาคือ "เลขตัวท้ายสุดของท่อน"
   เพราะชื่อสินค้าจริงมีตัวเลขอยู่ในตัวได้ (M150, โค้ก 325, ลีโอ 630)
   ห้ามกวาดตัวเลขทุกตัวออกจากชื่อเด็ดขาด ไม่งั้น M150 จะเหลือแค่ M */
function pickAmount(chunk){
  var c=String(chunk||'').trim();
  var m=c.match(/(\d+(?:\.\d+)?)\s*$/);
  if(m)return {amt:parseFloat(m[1]),name:c.slice(0,m.index).trim()};
  var t=c.match(THNUM);
  if(t){var v=thaiNum(t[1]);if(v>0)return {amt:v,name:c.slice(0,t.index).trim()};}
  return {amt:'',name:c};
}
function mkItem(rawName,amt){
  var t=/เงินเดือน|ได้รับ|ขายได้|ขายของ|ขาย|โอนเข้า|รายรับ|ได้มา|ได้เงิน|เข้ามา|โบนัส|ค่าจ้าง|ค่าแรง|คืนเงิน/.test(rawName)?'in':'out';
  var n=stripLead(rawName);
  if(!n)n=String(rawName||'').trim();
  return {name:n,amount:(amt===''||isNaN(amt))?'':amt,type:t,cat:''};
}
function parseSay(raw){
  var s=normSay(raw),r=pickAmount(stripLead(s));
  return mkItem(r.name||s,r.amt);
}
/* ลองตัดประโยคที่ไม่มีคำว่า "บาท" เช่น "ค่าข้าว 50 ค่าน้ำมัน 100"
   ยอมตัดเฉพาะตอนที่ทุกท่อนมีชื่อเป็นภาษาไทยยาวพอ ไม่งั้นคืนค่า null แล้วไปนับเป็นรายการเดียว
   (กันเคส "น้ำเปล่า 7 m150 12" ที่ตัดแล้วจะได้ชื่อว่า "m") */
function trySplitAlt(s){
  var re=/([^\d]{2,}?)\s*(\d+(?:\.\d+)?)/g,mm,out=[],last=0;
  while((mm=re.exec(s))!==null){
    var nm=mm[1].trim();
    if(nm.length<2||!/[\u0E00-\u0E7F]/.test(nm))return null;
    out.push(mkItem(nm,parseFloat(mm[2])));
    last=re.lastIndex;
  }
  if(out.length<2)return null;
  if(s.slice(last).trim())return null;
  return out;
}
function splitSay(raw){
  var s=normSay(raw);
  if(!s)return [mkItem('','')];
  var parts=null;
  if(/บาท|฿/.test(s))parts=s.split(/\s*(?:บาท|฿)\s*/);
  else if(CONNECT.test(s))parts=s.split(CONNECT);
  if(parts){
    parts=parts.filter(function(x){return x&&x.trim();});
    if(!parts.length)parts=null;
  }
  if(!parts){
    var alt=trySplitAlt(s);
    if(alt)return alt;
    parts=[s];
  }
  var out=[];
  for(var i=0;i<parts.length;i++){
    var p=stripLead(parts[i].trim());
    if(!p)continue;
    var r=pickAmount(p);
    if(!r.name&&r.amt!==''&&out.length&&out[out.length-1].amount===''){
      out[out.length-1].amount=r.amt;continue;}     /* เลขลอยตามหลัง = ราคาของรายการก่อนหน้า */
    if(!r.name&&r.amt==='')continue;
    out.push(mkItem(r.name||p,r.amt));
  }
  if(!out.length)out=[parseSay(s)];
  return out;
}
function learnKey(n){return String(n||'').replace(/\s+/g,'').toLowerCase();}
function guessCat(text,type){
  var s=String(text||'').toLowerCase().replace(/\s+/g,'');
  var L=D.learned[learnKey(text)];
  if(L&&L.cat){var arr0=D.cats[L.type||type]||[];for(var q=0;q<arr0.length;q++)if(arr0[q].n===L.cat)return L.cat;}
  var arr=D.cats[type]||[],best='',bl=0;
  for(var i=0;i<arr.length;i++)for(var j=0;j<arr[i].w.length;j++){
    var w=arr[i].w[j].toLowerCase().replace(/\s+/g,'');
    if(w&&s.indexOf(w)>=0&&w.length>bl){bl=w.length;best=arr[i].n;}}
  return best||arr[arr.length-1].n;
}
function balance(){var b=D.opening;for(var i=0;i<D.entries.length;i++){var e=D.entries[i];b+=e.type==='in'?e.amount:-e.amount;}return b;}
function monthOf(k){return k.slice(0,7);}
function sumMonth(ym){var r={'in':0,out:0};
  D.entries.forEach(function(e){if(monthOf(e.date)===ym)r[e.type]+=e.amount;});return r;}
function byDay(list){var g={},keys=[];
  list.forEach(function(e){if(!g[e.date]){g[e.date]=[];keys.push(e.date);}g[e.date].push(e);});return {g:g,keys:keys};}
function weekStart(dt){var d=new Date(dt);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;}
function sortEntries(a){return a.slice().sort(function(x,y){return x.date<y.date?1:(x.date>y.date?-1:(x.id<y.id?1:-1));});}
function streakDays(){
  if(!D.entries.length)return 0;
  var set={};D.entries.forEach(function(e){set[e.date]=1;});
  var n=0,d=new Date();
  if(!set[dkey(d)])d.setDate(d.getDate()-1);
  while(set[dkey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

      out.push({lab:d.getDate()+'',full:thDate(k),'in':(g[k]?g[k]['in']:0),out:(g[k]?g[k].out:0)});}

      var ws=weekStart(new Date());ws.setDate(ws.getDate()-i*7);
      var we=new Date(ws);we.setDate(we.getDate()+6);

      for(var x=new Date(ws);x<=we;x.setDate(x.getDate()+1)){var kk=dkey(x);if(g[kk]){si+=g[kk]['in'];so+=g[kk].out;}}
      out.push({lab:ws.getDate()+'/'+(ws.getMonth()+1),full:'สัปดาห์ '+ws.getDate()+' '+MTHS[ws.getMonth()],'in':si,out:so});}

  return out;
}

         bi=d['in']?Math.max(4,Math.round(d['in']/mxB*100)):0;}

/* Ver.15: ป้ายสองใบในคอลัมน์เดียวกันจะทับกันเฉพาะตอนแท่งสูงพอๆ กัน
   (คนละที่กันอยู่แล้วถ้าแท่งสูงต่างกัน) จึงยกเฉพาะใบที่อยู่บนกว่าให้ห่างกันอย่างน้อย 11px
   ไม่ดันใบล่างลง เพราะมันจะไปทับตัวแท่งจนอ่านไม่ออก */
function deColide(bx){
  var cols=bx.querySelectorAll('.bcol'),GAP=11;
  for(var i=0;i<cols.length;i++){
    var bi=cols[i].querySelector('.bar.i'),bo=cols[i].querySelector('.bar.o');
    if(!bi||!bo)continue;
    var ni=bi.querySelector('.bnum'),no=bo.querySelector('.bnum');

    ni.style.marginBottom='';no.style.marginBottom='';
    if(!ni.textContent||!no.textContent)continue;
    var d=bi.offsetHeight-bo.offsetHeight;
    if(Math.abs(d)>=GAP)continue;
    var lift=GAP-Math.abs(d);
    (d>=0?ni:no).style.marginBottom=(3+lift)+'px';
  }
}

/* Ver.14: เปลี่ยนจากเส้นยอดคงเหลือ เป็นสองเส้นวิ่งไล่กันแบบหน้าแนวโน้มของแอปร้านหอม

   90 วันจึงรวมเป็นรายสัปดาห์ และ 1 ปีรวมเป็นรายเดือน */
function trendData(){

function renderTrend(){

  var W=300,H=104,PB=8,i;
  var mx=1;pts.forEach(function(q){mx=Math.max(mx,q['in'],q.out);});

  function X(i){return pts.length<2?0:(i/(pts.length-1))*W;}
  function Y(v){return PB+(1-v/mx)*(H-PB*2);}

function countUp(el,from,to){
  if(from===to){el.innerHTML='<span class="bt">฿</span>'+fmt(to);return;}
  var t0=null,dur=560;
  function step(ts){if(!t0)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),v=from+(to-from)*(1-Math.pow(1-k,3));
    el.innerHTML='<span class="bt">฿</span>'+fmt(Math.round(v));
    if(k<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

var sheetStack=[],curSheet='',_popping=false,_histOn=false;

}

  _histOn=false;

(function(){

  var i,k;
  for(i=0;i<start;i++)h+='<div class="cal-d mut">'+(prevDays-start+i+1)+'</div>';

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,draft=null,editId=null,recTimer=null,readyTimer=null,silTimer=null;
var voice={state:'idle',text:'',msg:'',code:'',to:'basket',last:''};
function stopRec(){
  clearTimeout(recTimer);clearInterval(readyTimer);clearTimeout(silTimer);
  if(rec){try{rec.onend=null;rec.onresult=null;rec.onerror=null;rec.abort();}catch(e){}rec=null;}
  var s=document.getElementById('sayBtn');if(s)s.classList.remove('live');
  if(voice.state==='listening')voice.state='idle';
}
/* เริ่มฟัง: หน่วง 1.2 วิ ให้ตั้งตัวก่อน (เดิมฟังทันทีจนพูดไม่ทัน) แล้วฟังยาว 15 วิ */
function startListen(to,onDone){
  stopRec();
  voice.to=to||'basket';voice.text='';voice.msg='';voice.code='';
  if(!SR){voice.state='fail';voice.msg='เบราว์เซอร์นี้ไม่รองรับการพูด ใช้ Chrome หรือพิมพ์เอาก็ได้';voice.code='no-api';onDone();return;}
  realStart(onDone);
}
/* กติกาของ Ver.1 ที่ใช้ได้ดีและถูกเอากลับมา:
   ฟังทันทีที่กด ไม่มีนับถอยหลัง, continuous=false, ปล่อยให้เบราว์เซอร์ตัดสินเองว่าพูดจบ
   ตัวจับเวลาทั้งหมด (9 วิ Ver.2, นับ 3-2-1 + 15 วิ Ver.4, หยุดเมื่อเงียบ 2.5 วิ Ver.6) ถอดออกหมด
   เหลือแค่กันค้าง 60 วิ ซึ่งยาวเกินกว่าจะไปตัดคำพูดจริงได้ */
function realStart(onDone){
  var got='',fin='';
  try{
    rec=new SR();
    rec.lang='th-TH';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
    voice.state='listening';voice.text='';onDone();
    var s=document.getElementById('sayBtn');if(s)s.classList.add('live');
    rec.onstart=function(){clearTimeout(recTimer);
      recTimer=setTimeout(function(){if(rec){try{rec.abort();}catch(e){}}},60000);};
    rec.onresult=function(ev){
      var it='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)fin+=ev.results[i][0].transcript;else it+=ev.results[i][0].transcript;}
      got=(fin+it).trim();voice.text=got;
      var h=document.getElementById('heard');
      if(h){h.textContent=got||'กำลังฟัง…';h.classList.toggle('dim',!got);}};
    rec.onerror=function(ev){
      var c=ev.error||'unknown';
      voice.code=c;
      voice.msg=(c==='not-allowed'||c==='service-not-allowed')?'เบราว์เซอร์ยังไม่ให้ใช้ไมค์ กดไอคอนข้างช่องที่อยู่เว็บ แล้วเปิดสิทธิ์ไมโครโฟน'
        :c==='no-speech'?'ไม่ได้ยินเสียงเลย ลองพูดใกล้ๆ อีกที'
        :c==='network'?'ต่อบริการแปลงเสียงไม่ได้ ต้องมีเน็ตตอนพูด'
        :c==='audio-capture'?'หาไมโครโฟนไม่เจอ':'ฟังไม่สำเร็จ ลองอีกครั้ง';
      rec=null;clearTimeout(recTimer);
      if(!got){voice.state='fail';onDone();}};
    rec.onend=function(){
      rec=null;clearTimeout(recTimer);
      var s2=document.getElementById('sayBtn');if(s2)s2.classList.remove('live');
      var t=(fin||got).trim();
      if(t){buzz(14);voice.state='idle';voice.text='';gotSpeech(t);}
      else if(voice.state==='listening'){voice.state='fail';voice.msg='ยังไม่ได้ยินอะไร ลองอีกครั้ง';voice.code='empty';onDone();}};
    rec.start();
  }catch(e){voice.state='fail';voice.msg='เริ่มไมค์ไม่ได้ ลองปิดแอปอื่นที่ใช้ไมค์อยู่';voice.code='start-fail';onDone();}
}
function gotSpeech(text){
  var items=splitSay(text);
  voice.last=text;
  items.forEach(function(it){
    it.cat=guessCat(it.name,it.type);it.date=today();it.id=uid();
    D.basket.push(it);});
  save();toast(items.length>1?('ได้ยิน '+items.length+' รายการ'):'ได้ยินแล้ว ตรวจดูก่อนบันทึก','ok');
  drawSay();
}

/* ---- ชีตจดด้วยเสียง (สะสมได้หลายรายการก่อนบันทึก) ---- */
function openSay(){D.basket=D.basket||[];sheetOpen(drawSay);startListen('basket',drawSay);}
function saySpeakAgain(){startListen('basket',drawSay);}
function drawSay(){
  curSheet='voice';
  var head='';

    head='<div class="hear"><div class="heard dim" id="heard">กำลังฟัง…</div>'
      +'<div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div>'
      +'<button class="micbig stop" onclick="stopRec();drawSay()">หยุดฟัง</button>';
  else if(voice.state==='fail')
    head='<div class="hear"><div class="heard dim">'+esc(voice.msg)+'</div>'
      +(voice.code?'<div class="diag">รหัส: '+esc(voice.code)+'</div>':'')+'</div>'
      +'<button class="micbig" onclick="saySpeakAgain()">'+micSvg()+'ลองพูดอีกครั้ง</button>';
  else
    head='<div class="sh-t">พูดทีละอย่างแล้วกดพูดเพิ่มได้เรื่อยๆ · ถ้าพูดรวดเดียวหลายอย่าง ให้ลงท้ายราคาด้วยคำว่า <b>บาท</b> ทุกอย่าง เช่น “น้ำเปล่า 7 บาท M150 12 บาท”</div>'
      +'<button class="micbig" onclick="saySpeakAgain()">'+micSvg()+(D.basket.length?'พูดเพิ่มอีกรายการ':'แตะแล้วพูด')+'</button>';
  var body=head
   +(voice.last?'<div class="hintline" style="margin:10px 0 0">ได้ยินว่า “'+esc(voice.last)+'”</div>':'')
   +basketHtml()
   +'<div class="btn-row"><button class="btn btn-out" onclick="openFormFromSay()">พิมพ์เองดีกว่า</button></div>';
  paint('จดด้วยเสียง',body);
}
function micSvg(){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';}
function openFormFromSay(){stopRec();sheetPush(function(){openForm(null,null,-1,true);});}
function basketHtml(){
  if(!D.basket.length)return '';
  var tot=0;
  var rows=D.basket.map(function(it,i){
    var col=catColor(it.cat,it.type);
    var v=(it.amount===''||isNaN(it.amount))?0:it.amount;
    tot+=it.type==='in'?v:-v;
    return '<button class="brow" onclick="editBasket('+i+')">'
     +'<span class="bi" style="background:'+col+'22;color:'+col+'">'+esc((it.cat||'?').trim().charAt(0))+'</span>'
     +'<span class="bn"><span class="a">'+esc(it.name||'—')+'</span><span class="b">'+esc(it.cat)+' · '+esc(thDate(it.date))+(v?'':' · ยังไม่ใส่เงิน')+'</span></span>'
     +'<span class="bv" style="color:'+(it.type==='in'?'var(--in)':'var(--out)')+'">'+(it.type==='in'?'+':'−')+fmt(v)+'</span>'

  return '<div class="bask"><div class="bask-h">รอบันทึก<span class="r">'+D.basket.length+' รายการ · แตะเพื่อแก้</span></div>'
   +rows
   +'<div class="bask-f"><span class="k">รวมทั้งหมด</span><span class="v" style="color:'+(tot>=0?'var(--in)':'var(--out)')+'">'+(tot>=0?'+':'−')+fmt(Math.abs(tot))+'</span></div></div>'

function delBasket(i){D.basket.splice(i,1);save();buzz(10);drawSay();}
function editBasket(i){stopRec();sheetPush(function(){openForm(null,D.basket[i],i);});}
function saveBasket(){
  var ok=D.basket.filter(function(x){return x.name&&x.name.trim()&&parseFloat(x.amount)>0;});
  if(!ok.length){toast('ยังไม่มีรายการที่ใส่เงินครบ','del');return;}
  ok.forEach(function(x){
    D.entries.push({id:uid(),name:x.name.trim(),amount:parseFloat(x.amount),type:x.type,cat:x.cat,date:x.date||today()});
    D.learned[learnKey(x.name)]={cat:x.cat,type:x.type};});
  var left=D.basket.filter(function(x){return !(x.name&&x.name.trim()&&parseFloat(x.amount)>0);});
  D.basket=left;save();buzz(20);
  var n=ok.length;
  if(left.length){drawSay();toast('บันทึก '+n+' รายการแล้ว เหลือ '+left.length+' รายการที่ยังไม่ครบ','ok');}
  else{closeSheet(true);render();toast('บันทึก '+n+' รายการแล้ว','ok');}
  render();
}

/* ================= ฟอร์มรายการเดียว ================= */
function newRow(n,a,cat,type){
  n=n||'';return {n:n,a:(a===''||a==null||isNaN(a))?'':a,cat:cat||guessCat(n,type||'out'),catOpen:false,catSet:!!cat};}
function openForm(id,pre,bidx,toBasket){
  stopRec();editId=id||null;
  var e=id?D.entries.filter(function(x){return x.id===id;})[0]:null;
  var mode=(typeof bidx==='number'&&bidx>=0)?'basketEdit':(toBasket?'basketNew':'db');
  var type=e?e.type:((pre&&pre.type)||'out');
  draft={type:type,date:e?e.date:((pre&&pre.date)||today()),mode:mode,
         bidx:(typeof bidx==='number')?bidx:-1,calOpen:false};
  draft.calYm=monthOf(draft.date);
  draft.rows=[e?newRow(e.name,e.amount,e.cat,type)
               :newRow((pre&&pre.name)||'',(pre&&pre.amount!=null)?pre.amount:'',(pre&&pre.cat)||'',type)];
  draft.multi=(mode==='db'&&!editId);
  if(sheetStack.length)drawForm(!!(pre&&pre.name));
  else sheetOpen(function(){drawForm(!!(pre&&pre.name));});
}
function recentNames(n){
  var seen={},out=[];
  sortEntries(D.entries).forEach(function(e){var k=learnKey(e.name);if(seen[k])return;seen[k]=1;out.push(e);});
  return out.slice(0,n||8);
}
function rowsTotal(){var t=0;draft.rows.forEach(function(r){var v=parseFloat(r.a);if(v>0)t+=v;});return t;}
function liveRows(){return draft.rows.filter(function(r){return (r.n&&r.n.trim())||(r.a!==''&&parseFloat(r.a)>0);});}
function rowHtml(r,i){
  var cats=D.cats[draft.type];
  var filled=r.a!==''&&!isNaN(r.a)&&r.a>0;
  var h='<div class="rowwrap"><div class="frow">'
   +'<span class="fn"><input type="text" id="fNm'+i+'" value="'+esc(r.n)+'" oninput="onRowNm('+i+',this.value)" autocomplete="off" placeholder="เช่น ค่าข้าว"></span>'
   +'<span class="fm money sm'+(filled?' filled':'')+'" id="moneyBox'+i+'"><span class="cur">฿</span>'
   +'<input type="number" inputmode="decimal" id="fAmt'+i+'" value="'+(r.a===''?'':r.a)+'" oninput="onRowAmt('+i+',this.value)" placeholder="0"></span>'
   +(draft.rows.length>1?'<button class="fx tap" onclick="delRow('+i+')" aria-label="ลบแถวนี้">✕</button>':'')
   +'</div>';
  h+='<div class="rowcat'+((r.n&&r.n.trim())?'':' hide')+'" id="rcw'+i+'"><button class="rc" onclick="toggleRowCat('+i+')" id="rcat'+i+'">'
   +'<span class="dot" style="background:'+catColor(r.cat,draft.type)+'"></span>'+esc(r.cat)+' '+(r.catOpen?'▴':'▾')+'</button></div>';
  if(r.catOpen)
    h+='<div class="chiprow" style="margin-top:6px">'+cats.map(function(c,ci){
      return '<button class="chip sm'+(c.n===r.cat?' on':'')+'" onclick="pickRowCat('+i+','+ci+')">'
       +'<span class="dot" style="background:'+c.c+'"></span>'+esc(c.n)+'</button>';}).join('')+'</div>';
  return h+'</div>';

function drawForm(fromVoice){

  var pins=D.pins.filter(function(p){return (p.type||'out')===draft.type;});

  var pinChips=pins.length?'<div class="field"><span class="fl">'+pinLbl+'</span>'

      return '<button class="chip" onclick="useFormPin('+i+')">'
       +'<span class="dot" style="background:'+catColor(p.cat,p.type||'out')+'"></span>'+esc(p.n)+'</button>';}).join('')
   +'</div></div>'
   :'<div class="field"><span class="fl">'+pinLbl.split(' —')[0]+'</span>'
    +'<div class="hintline" style="padding:0">ยังไม่มีชิปฝั่งนี้ เพิ่มได้ที่ ตั้งค่า → ชิปซื้อประจำ</div></div>';
  /* Ver.12: ตัดแถว "ล่าสุด" ออกตามที่สั่ง — ชิปประจำทำหน้าที่นี้แทนทั้งสองฝั่ง */
  var n=draft.rows.length;
  var ttl=editId?'แก้รายการ':(draft.mode!=='db'?'ตรวจรายการ':(fromVoice?'ตรวจก่อนบันทึก':(draft.type==='in'?'รับเข้า':'จ่ายออก')));
  var live=liveRows().length;
  var okTxt=draft.mode==='basketEdit'?'อัปเดตรายการนี้':(draft.mode==='basketNew'?'เพิ่มเข้ารายการรอบันทึก'
    :(editId?'บันทึกการแก้':(live>1?('บันทึก '+live+' รายการ'):'บันทึก')));
  paint(ttl,
   '<div class="seg"><button class="'+(draft.type==='out'?'on o':'')+'" onclick="setType(\'out\')">จ่ายออก</button>'
  +'<button class="'+(draft.type==='in'?'on i':'')+'" onclick="setType(\'in\')">รับเข้า</button></div>'
  +'<div class="field"><span class="fl">รายการ และ จำนวนเงิน</span>'
  +draft.rows.map(rowHtml).join('')
  +(draft.multi?'<button class="addrowbtn" onclick="addRow()">＋ เพิ่มแถว</button>':'')
  +(n>1?'<div class="ftot"><span class="k" id="fTotK">รวม '+live+' รายการ</span><span class="v" id="fTot" style="color:'
    +(draft.type==='in'?'var(--in)':'var(--out)')+'">'+(draft.type==='in'?'+':'−')+fmt(rowsTotal())+'</span></div>':'')
  +'</div>'
  +pinChips
  +'<div class="field"><span class="fl">วันที่</span><div class="chiprow">'
  +dateChips(draft.date,draft.calOpen,'pickDate(0)','pickDate(1)','toggleCal()')+'</div>'
  +(draft.calOpen?calGrid(draft.calYm,draft.date,'formPickDate','calShiftForm'):'')+'</div>'
  +'<div class="err hide" id="fErr"></div>'
  +'<div class="stick"><button class="btn '+(draft.type==='in'?'btn-in':'btn-main')+'" id="fSave" onclick="saveEntry()">'+okTxt+'</button>'
  +(editId?'<div class="btn-row"><button class="btn btn-out" onclick="pinThis()">ปักหมุดเป็นชิป</button>'
    +'<button class="btn btn-danger" onclick="delEntry()">ลบ</button></div>':'')+'</div>');
  /* ไม่เรียกคีย์บอร์ดขึ้นมาเอง ให้เขาแตะช่องก่อน */
}
function onRowNm(i,v){
  var r=draft.rows[i];if(!r)return;
  r.n=v;
  if(!r.catSet){r.cat=guessCat(v,draft.type);
    var el=document.getElementById('rcat'+i);
    if(el)el.innerHTML='<span class="dot" style="background:'+catColor(r.cat,draft.type)+'"></span>'+esc(r.cat)+' ▾';}
  var w=document.getElementById('rcw'+i);
  if(w)w.classList.toggle('hide',!(r.n&&r.n.trim()));
  _syncFoot();
}
function onRowAmt(i,v){
  var r=draft.rows[i];if(!r)return;
  r.a=v===''?'':parseFloat(v);
  var ok=!(r.a===''||isNaN(r.a)||r.a<=0);
  var box=document.getElementById('moneyBox'+i);if(box)box.classList.toggle('filled',ok);
  _syncFoot();
}
function _syncFoot(){
  var t=document.getElementById('fTot');
  if(t)t.textContent=(draft.type==='in'?'+':'−')+fmt(rowsTotal());
  var k=document.getElementById('fTotK'),n=liveRows().length;
  if(k)k.textContent='รวม '+n+' รายการ';
  var b=document.getElementById('fSave');
  if(b&&draft.mode==='db'&&!editId)b.textContent=n>1?('บันทึก '+n+' รายการ'):'บันทึก';
}
function toggleRowCat(i){
  draft.rows.forEach(function(r,j){r.catOpen=(j===i)?!r.catOpen:false;});
  buzz(8);drawForm(false);
}
function pickRowCat(i,ci){
  var r=draft.rows[i];if(!r)return;
  r.cat=D.cats[draft.type][ci].n;r.catSet=true;r.catOpen=false;buzz(8);drawForm(false);
}
function addRow(){
  draft.rows.push(newRow('','','',draft.type));buzz(10);drawForm(false);
  var i=draft.rows.length-1,f=document.getElementById('fNm'+i);
  if(f)setTimeout(function(){f.focus();},80);
}
function delRow(i){
  if(draft.rows.length<2)return;
  draft.rows.splice(i,1);buzz(10);drawForm(false);
}
function useFormPin(i){
  var p=window._formPins[i];if(!p)return;
  var at=-1;
  draft.rows.forEach(function(r,j){if(at<0&&!(r.n&&r.n.trim()))at=j;});
  var row=newRow(p.n,(p.last>0?p.last:''),p.cat,draft.type);
  if(at>=0)draft.rows[at]=row;
  else if(draft.multi)draft.rows.push(row);
  else draft.rows[draft.rows.length-1]=row;
  buzz(10);drawForm(false);
}
function useRecent(i){
  var e=window._recent[i];if(!e)return;
  var at=-1;
  draft.rows.forEach(function(r,j){if(at<0&&!(r.n&&r.n.trim()))at=j;});
  var row=newRow(e.name,e.amount,e.cat,draft.type);
  if(at>=0)draft.rows[at]=row;else if(draft.multi)draft.rows.push(row);else draft.rows[0]=row;
  buzz(10);drawForm(false);
}
function setType(t){
  draft.type=t;
  draft.rows.forEach(function(r){
    var ok=false,cats=D.cats[t];
    for(var i=0;i<cats.length;i++)if(cats[i].n===r.cat)ok=true;
    if(!ok){r.cat=guessCat(r.n,t);r.catSet=false;}
    r.catOpen=false;});
  buzz(8);drawForm(false);
}
function saveEntry(){
  var err=document.getElementById('fErr');
  var rows=liveRows();
  if(!rows.length){err.textContent='ยังไม่ได้กรอกอะไรเลย';err.classList.remove('hide');return;}
  for(var i=0;i<rows.length;i++){
    if(!rows[i].n||!rows[i].n.trim()){err.textContent='มีแถวที่ใส่เงินแต่ยังไม่ได้ใส่ชื่อรายการ';err.classList.remove('hide');return;}
    if(!(parseFloat(rows[i].a)>0)){err.textContent='แถว “'+rows[i].n+'” ยังไม่ได้ใส่จำนวนเงิน';err.classList.remove('hide');return;}}
  var mk=function(r,id){return {id:id||uid(),name:r.n.trim(),amount:parseFloat(r.a),type:draft.type,cat:r.cat,date:draft.date||today()};};
  if(draft.mode==='basketEdit'){D.basket[draft.bidx]=mk(rows[0]);save();buzz(14);sheetBack();drawSay();toast('แก้ '+rows[0].n+' แล้ว','ok');return;}
  if(draft.mode==='basketNew'){D.basket.push(mk(rows[0]));save();buzz(14);sheetBack();drawSay();toast('เพิ่ม '+rows[0].n+' เข้ารายการรอบันทึก','ok');return;}
  if(editId){
    var r=mk(rows[0],editId);
    for(var j=0;j<D.entries.length;j++)if(D.entries[j].id===editId)D.entries[j]=r;
    D.learned[learnKey(r.name)]={cat:r.cat,type:r.type};
    save();buzz(18);closeSheet(true);render();toast('แก้ '+r.name+' แล้ว · '+fmt(r.amount),'ok');return;}
  var sum=0,first='';
  rows.forEach(function(x){var o=mk(x);sum+=o.amount;if(!first)first=o.name;
    D.entries.push(o);D.learned[learnKey(o.name)]={cat:o.cat,type:o.type};});
  save();buzz(18);closeSheet(true);render();
  toast(rows.length>1?('บันทึก '+rows.length+' รายการ · รวม '+fmt(sum))
    :('บันทึก'+(draft.type==='in'?'รายรับ ':'รายจ่าย ')+first+' '+fmt(sum)+' แล้ว'),'ok');
}
function delEntry(){
  if(!editId)return;
  var e=D.entries.filter(function(x){return x.id===editId;})[0];
  askConfirm('ลบรายการนี้?',(e?e.name+' · '+fmt(e.amount):'')+' ลบแล้วเอากลับไม่ได้','ลบเลย',function(){
    D.entries=D.entries.filter(function(x){return x.id!==editId;});
    save();closeSheet(true);render();toast('ลบ '+(e?e.name:'รายการ')+' แล้ว','del');},true);
}
function pinThis(){
  var r=draft.rows[0];if(!r||!r.n)return;
  addPin(r.n.trim(),r.cat,draft.type,parseFloat(r.a)||0);
  toast('ปักหมุด '+r.n+' เป็นชิปแล้ว','ok');
}
/* Ver.12: ฝั่งรับไม่เคยมีชิปมาก่อน ใส่ชุดตั้งต้นให้ครั้งเดียว แก้/ลบได้ในตั้งค่า */
function seedInPins(){
  if(D.pinsInV12)return;
  D.pinsInV12=1;
  var has=D.pins.some(function(p){return (p.type||'out')==='in';});
  if(!has){
    [['เงินเดือน','เงินเดือน'],['โบนัส','เงินเดือน'],['ขายของ','ขายของ'],['ได้เงินคืน','ได้รับจากคนอื่น']]
    .forEach(function(x){
      var c=(D.cats['in']||[]).some(function(k){return k.n===x[1];})?x[1]:(D.cats['in'][0]||{}).n;
      D.pins.push({n:x[0],cat:c,type:'in',last:0});});
  }
  save();
}
function addPin(n,cat,type,last){
  for(var i=0;i<D.pins.length;i++)if(learnKey(D.pins[i].n)===learnKey(n)){
    D.pins[i].last=last||D.pins[i].last;D.pins[i].cat=cat||D.pins[i].cat;save();return;}
  D.pins.push({n:n,cat:cat,type:type||'out',last:last||0});save();
}
function toggleCal(){draft.calOpen=!draft.calOpen;draft.calYm=monthOf(draft.date);buzz(8);drawForm(false);showCal();}
function showCal(){setTimeout(function(){var c=document.querySelector('.cal');
  if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'});},70);}
function calShiftForm(d){draft.calYm=shiftYM(draft.calYm,d);buzz(8);drawForm(false);showCal();}
function formPickDate(k){draft.date=k;draft.calOpen=false;buzz(10);drawForm(false);}
/* ================= หน้าตั้งค่า (จัดใหม่เป็นกลุ่มเมนู) ================= */
var advOpen=false;

 theme:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.6 12h16.8"/>',
 moon:'<path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.5 8.5 0 1 0 20 14.6z"/>',
 money:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/>',
 pin:'<path d="M12 21v-6"/><path d="M8.5 3h7l-1 6 3 3v3H6.5v-3l3-3z"/>',
 tag:'<path d="M3.5 12.5l8-8H20v8.5l-8 8z"/><circle cx="16" cy="8" r="1.4"/>',
 save:'<path d="M5 4h11l3 3v13H5z"/><path d="M9 4v5h6V4"/><rect x="8" y="13" width="8" height="6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/>',
 brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V16a3 3 0 0 0 4 2.8"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V16a3 3 0 0 1-4 2.8"/><path d="M12 4.5v15"/>',
 trash:'<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>'
};
function srow(icon,title,sub,val,onclick,extra){
  return '<button class="srow" onclick="'+onclick+'">'
   +'<span class="si"><svg viewBox="0 0 24 24">'+icon+'</svg></span>'
   +'<span class="sn"><span class="a">'+title+'</span>'+(sub?'<span class="b">'+sub+'</span>':'')+'</span>'
   +(val?'<span class="sv">'+val+'</span>':'')
   +(extra||'<span class="sgo">›</span>')+'</button>';
}
function renderSet(){
  var nOut=D.cats.out.length,nIn=D.cats['in'].length,nL=Object.keys(D.learned).length;
  var h='';
  h+='<div class="sgrp"><div class="gt">หน้าตา</div><div class="slist">'
   +srow(ICO.moon,'โหมดกลางคืน','พื้นหลังเข้ม สบายตาตอนกลางคืน','','toggleDark()','<span class="sw2'+(D.dark?' on':'')+'"></span>')
   +'</div></div>';
  h+='<div class="sgrp"><div class="gt">เงินและหมวดหมู่</div><div class="slist">'
   +srow(ICO.money,'เงินตั้งต้น','เงินที่มีก่อนเริ่มใช้แอป',fmt(D.opening),'openOpening()')
   +srow(ICO.pin,'ชิปซื้อประจำ','ของที่ซื้อบ่อย กดชิปแล้วใส่ราคาได้เลย',D.pins.length?D.pins.length+' ชิป':'ยังไม่มี','openPins()')
   +srow(ICO.tag,'หมวดรายจ่าย','',nOut+' หมวด','openCats(\'out\')')
   +srow(ICO.tag,'หมวดรายรับ','',nIn+' หมวด','openCats(\'in\')')
   +'</div></div>';
  h+='<div class="sgrp"><div class="gt">ข้อมูล</div><div class="slist">'
   +srow(ICO.save,'สำรองข้อมูล','เก็บไฟล์ไว้ หรือเอาไฟล์เก่ากลับเข้ามา',D.backupAt?thDate(dkey(new Date(D.backupAt))):'ยังไม่เคย','openBackup()')
   +'</div></div>';
  h+='<div class="sgrp"><div class="gt">ขั้นสูง</div><div class="slist">'
   +srow(ICO.gear,'ตั้งค่าขั้นสูง','คำที่แอปจำได้ · ลบข้อมูล','','toggleAdv()','<span class="sgo">'+(advOpen?'⌃':'⌄')+'</span>')
   +(advOpen?
      srow(ICO.brain,'คำที่แอปจำได้',nL?'แก้หมวดครั้งเดียว ครั้งหน้าจำได้เอง':'ยังไม่มี',nL?nL+' คำ':'','openLearned()')
     +srow(ICO.trash,'ลบรายการทั้งหมด','เอากลับไม่ได้ สำรองไฟล์ก่อนดีกว่า','','wipeAll()')
   :'')
   +'</div></div>';
  h+='<div class="hintline" style="text-align:center;padding:2px 0 24px;color:var(--ink3)">มุ่ยเฟย Ver.15 · ข้อมูลเก็บอยู่ในเครื่องนี้เครื่องเดียว</div>';
  document.getElementById('setBody').innerHTML=h;
}
function toggleAdv(){advOpen=!advOpen;buzz(8);renderSet();}
function toggleDark(){D.dark=!D.dark;save();applyTheme();buzz(10);renderSet();toast(D.dark?'เปิดโหมดกลางคืน':'ปิดโหมดกลางคืน','info');}

/* ---- เงินตั้งต้น ---- */
function openOpening(){sheetOpen(drawOpening);}
function drawOpening(){
  curSheet='opening';
  paint('เงินตั้งต้น','<div class="sh-t">ยอดคงเหลือ = เงินตั้งต้น + รับทั้งหมด − จ่ายทั้งหมด</div>'
   +'<div class="field"><span class="fl">เงินที่มีอยู่ก่อนเริ่มใช้แอป</span>'
   +'<div class="money filled"><span class="cur">฿</span><input type="number" inputmode="decimal" id="openBal" value="'+D.opening+'"></div></div>'
   +'<button class="btn btn-main" onclick="saveOpening()">บันทึกเงินตั้งต้น</button>');
}
function saveOpening(){
  var v=parseFloat(document.getElementById('openBal').value);
  D.opening=isNaN(v)?0:v;save();_lastBal=null;closeSheet(true);render();toast('บันทึกเงินตั้งต้น '+fmt(D.opening)+' แล้ว','ok');
}

/* ---- หมวด / ชิป ---- */
var curCatType='out';
function openCats(t){curCatType=t;sheetOpen(drawCatList);}
function drawCatList(){
  curSheet='cats';
  var arr=D.cats[curCatType];
  var rows=arr.map(function(c,i){
    var used=D.entries.filter(function(e){return e.cat===c.n&&e.type===curCatType;}).length;
    return '<button class="setrow" onclick="editCat(\''+curCatType+'\','+i+')">'
     +'<span class="dot" style="background:'+c.c+';width:14px;height:14px;flex:0 0 14px"></span>'
     +'<span class="cn">'+esc(c.n)+'</span><span class="go">'+(used?used+' รายการ ':'')+'›</span></button>';}).join('');
  paint(curCatType==='out'?'หมวดรายจ่าย':'หมวดรายรับ',
   '<div class="grp">'+rows+'</div>'
   +'<button class="btn btn-out" onclick="editCat(\''+curCatType+'\',-1)">+ เพิ่มหมวดใหม่</button>');
}
function openPins(){sheetOpen(drawPinList);}
function drawPinList(){
  curSheet='pins';
  var rows=D.pins.length?D.pins.map(function(p,i){
    return '<button class="setrow" onclick="editPin('+i+')">'
     +'<span class="dot" style="background:'+catColor(p.cat,p.type||'out')+';width:14px;height:14px;flex:0 0 14px"></span>'
     +'<span class="cn">'+esc(p.n)+'<span style="color:var(--ink3);font-size:11.5px"> · '+esc(p.cat)+(p.last>0?' · '+fmt(p.last):'')+'</span></span>'
     +'<span class="go">›</span></button>';}).join('')
   :'<div class="hintline">ยังไม่มีชิป ชิปคือของที่ซื้อบ่อย เอาไว้กดแล้วใส่ราคาได้เลยตอนจดหลายรายการ</div>';
  paint('ชิปซื้อประจำ','<div class="grp">'+rows+'</div>'
   +'<button class="btn btn-out" onclick="editPin(-1)">+ เพิ่มชิปใหม่</button>');
}
var edit=null;
function editPin(i){
  var p=i>=0?D.pins[i]:null;
  edit={kind:'pin',idx:i,n:p?p.n:'',cat:p?p.cat:D.cats.out[0].n,type:p?(p.type||'out'):'out',last:p?(p.last||0):0};
  sheetPush(drawEdit);
}
function editCat(t,i){
  var c=i>=0?D.cats[t][i]:null;
  edit={kind:'cat',type:t,idx:i,n:c?c.n:'',c:c?c.c:SWATCH[D.cats[t].length%SWATCH.length]};
  sheetPush(drawEdit);
}
function drawEdit(){
  curSheet='edit';
  if(edit.kind==='cat'){
    var sw=SWATCH.map(function(c,i){
      return '<button class="sw'+(c===edit.c?' on':'')+'" style="background:'+c+'" onclick="pickSw('+i+')" aria-label="สี'+(i+1)+'"></button>';}).join('');
    paint(edit.idx<0?'เพิ่มหมวดใหม่':'แก้หมวด',
      '<div class="field"><span class="fl">ชื่อหมวด</span><input type="text" id="eNm" value="'+esc(edit.n)+'" oninput="edit.n=this.value"></div>'
     +'<div class="field"><span class="fl">สีประจำหมวด</span><div class="swatches">'+sw+'</div></div>'
     +'<button class="btn btn-main" onclick="saveEdit()">บันทึก</button>'
     +(edit.idx>=0&&D.cats[edit.type].length>1?'<div class="btn-row"><button class="btn btn-danger" onclick="removeEdit()">ลบหมวดนี้</button></div>':''));
    return;
  }
  var cats=D.cats[edit.type];
  var chips=cats.map(function(c,i){
    return '<button class="chip'+(c.n===edit.cat?' on':'')+'" onclick="pickEditCat('+i+')">'
     +'<span class="dot" style="background:'+c.c+'"></span>'+esc(c.n)+'</button>';}).join('');
  paint(edit.idx<0?'เพิ่มชิปใหม่':'แก้ชิป',
   '<div class="field"><span class="fl">ชื่อของที่ซื้อประจำ</span><input type="text" id="eNm" value="'+esc(edit.n)+'" oninput="edit.n=this.value" placeholder="เช่น ค่าข้าว, ค่าน้ำมัน"></div>'
   +'<div class="seg"><button class="'+(edit.type==='out'?'on o':'')+'" onclick="setEditType(\'out\')">จ่ายออก</button>'
   +'<button class="'+(edit.type==='in'?'on i':'')+'" onclick="setEditType(\'in\')">รับเข้า</button></div>'
   +'<div class="field"><span class="fl">หมวด</span><div class="chipwrap">'+chips+'</div></div>'
   +'<div class="field"><span class="fl">ราคาที่ใช้บ่อย (ใส่หรือไม่ใส่ก็ได้)</span>'
   +'<div class="money'+(edit.last>0?' filled':'')+'"><span class="cur">฿</span>'
   +'<input type="number" inputmode="decimal" id="eLast" value="'+(edit.last||'')+'" oninput="edit.last=parseFloat(this.value)||0"></div></div>'
   +'<button class="btn btn-main" onclick="saveEdit()">บันทึก</button>'
   +(edit.idx>=0?'<div class="btn-row"><button class="btn btn-danger" onclick="removeEdit()">ลบชิปนี้</button></div>':''));
}
function pickSw(i){edit.c=SWATCH[i];buzz(8);drawEdit();}
function pickEditCat(i){edit.cat=D.cats[edit.type][i].n;buzz(8);drawEdit();}
function setEditType(t){edit.type=t;edit.cat=D.cats[t][0].n;buzz(8);drawEdit();}
function saveEdit(){
  var n=(edit.n||'').trim();
  if(!n){toast('ยังไม่ได้ใส่ชื่อ','del');return;}
  if(edit.kind==='cat'){
    var arr=D.cats[edit.type];
    for(var i=0;i<arr.length;i++)if(arr[i].n===n&&i!==edit.idx){toast('มีหมวดชื่อนี้แล้ว','del');return;}
    if(edit.idx<0){arr.splice(Math.max(0,arr.length-1),0,{n:n,c:edit.c,w:[n]});save();sheetBack();render();toast('เพิ่มหมวด '+n+' แล้ว','ok');return;}
    var old=arr[edit.idx].n;
    arr[edit.idx].n=n;arr[edit.idx].c=edit.c;
    if(old!==n){
      D.entries.forEach(function(e){if(e.cat===old&&e.type===edit.type)e.cat=n;});
      D.basket.forEach(function(e){if(e.cat===old&&e.type===edit.type)e.cat=n;});
      D.pins.forEach(function(p){if(p.cat===old)p.cat=n;});
      for(var k in D.learned)if(D.learned.hasOwnProperty(k)&&D.learned[k].cat===old)D.learned[k].cat=n;}
    save();sheetBack();render();toast('แก้หมวดเป็น '+n+' แล้ว','ok');return;
  }
  if(edit.idx<0){
    for(var j=0;j<D.pins.length;j++)if(learnKey(D.pins[j].n)===learnKey(n)){toast('มีชิปชื่อนี้แล้ว','del');return;}
    D.pins.push({n:n,cat:edit.cat,type:edit.type,last:edit.last||0});
    save();sheetBack();render();toast('เพิ่มชิป '+n+' แล้ว','ok');return;}
  D.pins[edit.idx]={n:n,cat:edit.cat,type:edit.type,last:edit.last||0};
  save();sheetBack();render();toast('แก้ชิปเป็น '+n+' แล้ว','ok');
}
function removeEdit(){
  if(edit.kind==='cat'){
    var arr=D.cats[edit.type],c=arr[edit.idx];
    var used=D.entries.filter(function(e){return e.cat===c.n&&e.type===edit.type;}).length;
    var fall=arr[arr.length-1].n;
    if(fall===c.n)fall=arr.length>1?arr[arr.length-2].n:'อื่นๆ';
    askConfirm('ลบหมวด '+c.n+'?',used?('มี '+used+' รายการในหมวดนี้ ลบแล้วจะย้ายไปหมวด “'+fall+'”'):'ลบหมวดนี้ออกจากรายการ','ลบเลย',function(){
      D.entries.forEach(function(e){if(e.cat===c.n&&e.type===edit.type)e.cat=fall;});
      D.pins.forEach(function(p){if(p.cat===c.n)p.cat=fall;});
      arr.splice(edit.idx,1);save();sheetBack();render();toast('ลบหมวด '+c.n+' แล้ว','del');},true);
    return;
  }
  var p=D.pins[edit.idx];
  askConfirm('ลบชิป '+p.n+'?','รายการที่บันทึกไปแล้วยังอยู่เหมือนเดิม','ลบเลย',function(){
    D.pins.splice(edit.idx,1);save();sheetBack();render();toast('ลบชิป '+p.n+' แล้ว','del');},true);
}

/* ---- สำรองข้อมูล / คำที่จำได้ / ล้างข้อมูล ---- */
function openBackup(){sheetOpen(drawBackup);}
function drawBackup(){
  curSheet='backup';
  paint('สำรองข้อมูล',
   '<div class="hintline" style="margin-bottom:14px">'+(D.backupAt?('สำรองล่าสุด '+thDate(dkey(new Date(D.backupAt)))):'ยังไม่เคยสำรองข้อมูลเลย')
   +' · ตอนนี้มี '+D.entries.length+' รายการ</div>'
   +'<button class="btn btn-main" onclick="doExport()">บันทึกไฟล์สำรองลงเครื่อง</button>'
   +'<div class="btn-row"><button class="btn btn-out" onclick="document.getElementById(\'impFile\').click()">นำไฟล์กลับเข้ามา</button></div>'
   +'<input type="file" id="impFile" accept="application/json,.json" class="hide" onchange="doImport(this)">'
   +'<div class="hintline" style="margin-top:14px">ข้อมูลอยู่ในเครื่องนี้เครื่องเดียว ถ้าล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหายโดยไม่เตือน สำรองไฟล์ไว้เดือนละครั้งกำลังดี</div>');
}
function openLearned(){sheetOpen(drawLearned);}
function drawLearned(){
  curSheet='learned';
  var ks=Object.keys(D.learned);
  var rows=ks.length?ks.slice(0,60).map(function(k){
    var v=D.learned[k];
    return '<div class="setrow"><span class="dot" style="background:'+catColor(v.cat,v.type||'out')+';width:12px;height:12px;flex:0 0 12px"></span>'
     +'<span class="cn">'+esc(k)+'</span><span class="go">'+esc(v.cat)+'</span></div>';}).join('')
   :'<div class="hintline">ยังไม่มี เมื่อไหร่ที่คุณแก้หมวดที่แอปเดาผิด มุ่ยเฟยจะจำคำนั้นไว้</div>';
  paint('คำที่แอปจำได้','<div class="grp">'+rows+'</div>'
   +(ks.length?'<button class="btn btn-danger" onclick="clearLearned()">ล้างคำที่จำไว้ทั้งหมด</button>':''));
}
function clearLearned(){
  askConfirm('ล้างคำที่จำไว้?','แอปจะกลับไปเดาหมวดจากคำพื้นฐานเหมือนตอนเริ่มใช้','ล้างเลย',function(){
    var n=Object.keys(D.learned).length;
    D.learned={};save();drawLearned();renderSet();toast('ล้างคำที่จำไว้ '+n+' คำแล้ว','del');},true);
}
function doExport(){
  var blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muifei-'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},800);
  D.backupAt=Date.now();save();render();drawBackup();toast('บันทึกไฟล์สำรองแล้ว','ok');
}
function doImport(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.entries))throw new Error('bad');
      askConfirm('นำเข้า '+o.entries.length+' รายการ?','ข้อมูลตอนนี้ '+D.entries.length+' รายการจะถูกทับทั้งหมด','นำเข้าเลย',function(){
        D=Object.assign(load(),o);save();_lastBal=null;applyTheme();closeSheet(true);render();
        toast('นำเข้า '+o.entries.length+' รายการแล้ว','ok');},true);
    }catch(e){toast('ไฟล์นี้อ่านไม่ได้ ต้องเป็นไฟล์ที่กดสำรองจากแอปนี้','del');}
    inp.value='';};
  r.readAsText(f);
}
function wipeAll(){
  askConfirm('ลบรายการทั้งหมด?','มี '+D.entries.length+' รายการ ลบแล้วเอากลับไม่ได้ ถ้ายังไม่ได้สำรองไฟล์ กดยกเลิกก่อน','ลบทั้งหมด',function(){
    askConfirm('แน่ใจอีกครั้ง','กดยืนยันแล้วรายการทั้งหมดจะหายทันที','ยืนยันลบ',function(){
      var n=D.entries.length;
      D.entries=[];D.basket=[];save();_lastBal=null;render();toast('ลบรายการทั้งหมด '+n+' รายการแล้ว','del');},true);},true);
}
function finishFirst(skip){
  var v=skip?0:parseFloat(document.getElementById('firstBal').value);
  D.opening=isNaN(v)?0:v;D.setup=true;save();
  document.getElementById('first').classList.add('hide');
  render();toast('เริ่มใช้มุ่ยเฟยได้เลย','ok');
}

/* ================= เริ่มทำงาน ================= */
document.getElementById('askOk').onclick=function(){askClose(true);};
document.getElementById('askNo').onclick=function(){askClose(false);};
document.getElementById('ask').onclick=function(e){if(e.target===this)askClose(false);};
applyTheme();
seedInPins();
goTab('home');
if(!D.setup)document.getElementById('first').classList.remove('hide');
</script>
