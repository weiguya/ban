<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>มุ่ยเฟย</title>
<meta name="theme-color" content="#3FA7E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   มุ่ยเฟย  Ver.5   ชุดสีอ่อน (ฟ้าใส) + กราฟมีตัวเลข
   โทนฟ้า-ม่วง ลดความจัดลง / ไม่มีมาสคอต / เลือกธีมได้ 12 สี + โหมดกลางคืน
   เขียว = เงินเข้า, แดง = เงินออก  (จองไว้ ห้ามเอาไปใช้เป็นสีปุ่ม)
   ทุกสีอยู่ในตัวแปร --xxx เท่านั้น เพื่อให้เปลี่ยนธีมทั้งแอปได้จากที่เดียว
   ========================================================== */
:root{
  --brand:#3FA7E8;
  --brand2:#78CBF2;
  --brand-soft:#E4F3FC;
  --bg:#EFF7FD;
  --card:#FFFFFF;
  --card2:#F7F8FD;
  --ink:#1E2340;
  --ink2:#606780;
  --ink3:#9BA2BC;
  --line:#E8EBF5;
  --line2:#D3D8E8;
  --field:#F5F7FC;
  --in:#12946B;
  --in2:#2BC08C;
  --in-soft:#E3F6EE;
  --out:#E05548;
  --out2:#FF8B7E;
  --out-soft:#FDECEA;
  --sh:0 1px 3px rgba(30,35,64,.05), 0 10px 24px -16px rgba(30,35,64,.34);
  --sh-up:0 4px 10px rgba(30,35,64,.07), 0 20px 36px -18px rgba(30,35,64,.4);
  --r:20px;
  --pad:14px;
  --sb:env(safe-area-inset-bottom,0px);
  --ez:cubic-bezier(.2,.9,.25,1);
}
body.dark{
  --bg:#12142A;
  --card:#1D2040;
  --card2:#252947;
  --ink:#ECEEFA;
  --ink2:#A3A9C8;
  --ink3:#767D9E;
  --line:#2A2E52;
  --line2:#3A3F68;
  --field:#252947;
  --brand-soft:#2A2F5C;
  --in-soft:#173A31;
  --out-soft:#3A2029;
  --sh:0 1px 3px rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
  --sh-up:0 4px 10px rgba(0,0,0,.35), 0 20px 36px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Thai",-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:calc(112px + var(--sb));
  transition:background .25s,color .25s;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-family:"Kanit",sans-serif;font-variant-numeric:tabular-nums}
.hide{display:none !important}
.tap{transition:transform .14s var(--ez)}
.tap:active{transform:scale(.94)}

/* ---------- หัวจอ (ข้อ 2 โลโก้ใหญ่ขึ้นทั้งแถบ) ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px var(--pad) 0}
.trow{display:flex;align-items:center;gap:11px;min-height:46px}
.mark{width:42px;height:42px;flex:0 0 42px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--brand),var(--brand2));box-shadow:0 8px 18px -9px var(--brand)}
.mark span{font-family:"Kanit",sans-serif;font-size:21px;font-weight:600;color:#fff;line-height:1;margin-top:2px}
.brand{min-width:0}
.brand b{display:block;font-family:"Kanit",sans-serif;font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.brand i{display:block;font-style:normal;font-size:11.5px;color:var(--ink3);margin-top:1px}
.bk{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--ink2);border:1.5px solid var(--line2);border-radius:999px;padding:5px 11px;background:var(--card)}
.bk.old{color:#9A6B00;border-color:#FFE08A;background:#FFF8E1}
body.dark .bk.old{color:#FFD98A;border-color:#6A5510;background:#332A08}
.tabs{display:flex;gap:7px;padding:12px 0 6px}
.tab{flex:1;font-size:14px;font-weight:500;color:var(--ink2);padding:10px 0;border-radius:14px;text-align:center;background:var(--card);transition:.2s var(--ez)}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:600;box-shadow:0 7px 15px -7px var(--brand)}
.page{padding:2px var(--pad) 0}
.page.off{display:none}

/* ---------- การ์ด ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ct h2{margin:0;font-size:15px;font-weight:600}
.ct .sub{font-size:12px;color:var(--ink3)}

/* ---------- ยอดคงเหลือ ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 16px;margin-bottom:12px;
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand2) 100%);
  box-shadow:0 14px 30px -16px var(--brand)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:210px;height:210px;border-radius:50%;
  background:rgba(255,255,255,.10);pointer-events:none}
.hero::before{content:"";position:absolute;right:-30px;bottom:-110px;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.07);pointer-events:none}
.hero .lb{font-size:12.5px;color:rgba(255,255,255,.94);position:relative}
.hero .amt{font-family:"Kanit",sans-serif;font-weight:600;font-size:42px;line-height:1.12;color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums;position:relative}
.hero .amt .bt{font-size:20px;font-weight:400;opacity:.7;margin-right:3px}
.hpills{display:flex;gap:9px;margin-top:15px;position:relative}
.hpill{flex:1;background:rgba(255,255,255,.22);border-radius:14px;padding:9px 12px}
.hpill .k{font-size:11px;color:rgba(255,255,255,.92)}
.hpill .v{font-family:"Kanit",sans-serif;font-size:17px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums;margin-top:1px}
.streak{display:flex;align-items:center;gap:6px;margin:-4px 2px 12px;font-size:12px;color:var(--ink2)}
.streak b{color:var(--brand);font-weight:600}

/* ---------- ชิป ---------- */
.chiprow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.chipwrap{display:flex;gap:8px;flex-wrap:wrap}
.chip{white-space:nowrap;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;
  border:1.5px solid var(--line2);color:var(--ink2);background:var(--card);
  transition:transform .14s var(--ez),background .18s,color .18s,border-color .18s;
  display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sm{font-size:12px;padding:6px 12px}
.dot{width:9px;height:9px;border-radius:99px;flex:0 0 9px}
.chip.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.6)}

/* ---------- กราฟ ---------- */
.bars{display:flex;align-items:flex-end;height:152px;margin-top:8px}
.numwrap{height:13px;display:flex;align-items:flex-end;justify-content:center}
.bnum{font-family:"Kanit",sans-serif;font-size:9px;line-height:1;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.bcol.sel .bnum{color:var(--brand);font-weight:600}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bpair{display:flex;align-items:flex-end;gap:3px;height:104px;width:100%;justify-content:center}
.bar{flex:0 0 11px;width:11px;border-radius:6px;height:0;transition:height .6s var(--ez)}
.bar.bmark{flex:0 0 6px;width:6px;opacity:.85}
.bar.i{background:linear-gradient(180deg,var(--in2),var(--in))}
.bar.o{background:linear-gradient(180deg,var(--out2),var(--out))}
.bar.z{background:var(--line);height:4px !important}
.bcol.sel .bar{box-shadow:0 0 0 2.5px var(--card),0 0 0 5px var(--brand-soft)}
.blab{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bcol.sel .blab{color:var(--brand);font-weight:600}
.readout{display:flex;align-items:baseline;gap:12px;margin-top:10px;padding-top:10px;border-top:1.5px solid var(--line);min-height:34px}
.readout .rl{font-size:12px;color:var(--ink2)}
.readout .rv{font-family:"Kanit",sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- สรุป ---------- */
.headline{font-size:15px;line-height:1.6;margin-bottom:14px}
.headline b{font-weight:600}
.headline .big{font-family:"Kanit",sans-serif;font-size:20px;font-weight:600}
.donutwrap{display:flex;gap:16px;align-items:center}
.donut{flex:0 0 110px;position:relative}
.donut svg{transform:rotate(-90deg);display:block}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .m1{font-size:10.5px;color:var(--ink3)}
.donut .m2{font-family:"Kanit",sans-serif;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.catlist{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:8px;padding:5px 0}
.cnm{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpc{font-family:"Kanit",sans-serif;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- รายการ ---------- */
.dayhd{display:flex;align-items:baseline;justify-content:space-between;padding:12px 4px 5px;font-size:12px;color:var(--ink2)}
.dayhd .dn{font-family:"Kanit",sans-serif;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px;border-radius:17px;background:var(--card);margin-bottom:7px;box-shadow:0 2px 6px -3px rgba(30,35,64,.16);transition:.15s var(--ez)}
.line:active{transform:scale(.985)}
.ico{flex:0 0 36px;height:36px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:"Kanit",sans-serif;font-size:15px;font-weight:500}
.nm{flex:1;min-width:0}
.t1{display:block;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:"Kanit",sans-serif;font-weight:500;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.i{color:var(--in)}
.amt.o{color:var(--out)}
.line.armed{background:var(--brand-soft);box-shadow:inset 3.5px 0 0 var(--brand)}
.empty{padding:24px 8px;color:var(--ink2);font-size:14px;line-height:1.8;text-align:center}
.empty b{color:var(--ink);font-weight:600}
.linkbtn{display:block;width:100%;text-align:center;padding:12px;font-size:13.5px;font-weight:600;color:var(--brand)}

.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav .mb{width:40px;height:40px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:18px;color:var(--brand)}
.mnav .mt{font-family:"Kanit",sans-serif;font-size:17px;font-weight:500}

/* ---------- ฟอร์ม ---------- */
.fl{display:block;font-size:12px;color:var(--ink2);margin:0 0 7px 3px}
.field{margin-bottom:15px}
input[type=text],input[type=number]{
  width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;font-size:15.5px;transition:.18s}
input:focus{background:var(--card);border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
input::placeholder{color:var(--ink3)}

/* ข้อ 4 — ช่องจำนวนเงินมีกรอบหนา เห็นชัดว่าต้องกรอกตรงไหน */
.money{position:relative}
.money .cur{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-family:"Kanit",sans-serif;font-size:18px;color:var(--ink3);pointer-events:none}
.money input{border:2px solid var(--line2);background:var(--card);padding:14px 14px 14px 38px;
  font-family:"Kanit",sans-serif;font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.money input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.money.filled input{border-color:var(--brand)}
.money.filled .cur{color:var(--brand)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 16px;border-radius:17px;font-weight:600;font-size:15.5px;width:100%;transition:transform .14s var(--ez)}
.btn:active{transform:scale(.97)}
.btn-main{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 9px 18px -9px var(--brand)}
.btn-in{background:linear-gradient(135deg,var(--in2),var(--in));color:#fff}
.btn-out{border:1.5px solid var(--line2);color:var(--ink);background:var(--card)}
.btn-danger{border:1.5px solid var(--out);color:var(--out);background:var(--card)}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{flex:1}

/* ---------- แถบล่าง + ปุ่มบวก ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px var(--pad) calc(10px + var(--sb));
  background:linear-gradient(180deg,transparent,var(--bg) 32%)}
.say{width:100%;height:58px;border-radius:20px;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:16px;font-weight:600;background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:0 12px 24px -12px var(--brand);transition:transform .14s var(--ez)}
.say:active{transform:scale(.97)}
.say.live{background:linear-gradient(135deg,var(--out2),var(--out))}
.mic{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.fab{position:fixed;right:calc(var(--pad) + 4px);bottom:calc(88px + var(--sb));z-index:33;width:52px;height:52px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--sh-up);
  border:1.5px solid var(--line2);transition:transform .22s var(--ez)}
.fab svg{stroke:var(--brand)}
.fab.rot{transform:rotate(45deg)}
.fab:active{transform:scale(.9)}
.fab.rot:active{transform:rotate(45deg) scale(.9)}
.dial{position:fixed;right:calc(var(--pad) + 4px);z-index:32;display:flex;align-items:center;gap:9px;
  transform:translateY(14px) scale(.9);opacity:0;pointer-events:none;transition:.24s var(--ez)}
.dial.on{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.dial .dl{font-size:13.5px;font-weight:600;background:var(--card);color:var(--ink);padding:8px 13px;border-radius:999px;box-shadow:var(--sh)}
.dial .db{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-up)}
.dial1{bottom:calc(152px + var(--sb))}
.dial2{bottom:calc(208px + var(--sb))}
.dial3{bottom:calc(264px + var(--sb))}
.dialscrim{position:fixed;inset:0;z-index:31;background:rgba(20,24,52,.3);opacity:0;pointer-events:none;transition:.22s}
.dialscrim.on{opacity:1;pointer-events:auto}

/* ---------- ชีต (ข้อ 1 ปิดได้ 4 ทาง) ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,24,52,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:28px 28px 0 0;
  padding:0 var(--pad) calc(14px + var(--sb));transform:translateY(103%);
  transition:transform .36s cubic-bezier(.22,1.04,.3,1);max-height:86vh;overflow:auto;overscroll-behavior:contain;
  box-shadow:0 -12px 44px -14px rgba(20,24,52,.5)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.shhead{position:sticky;top:0;z-index:5;background:var(--card);padding-top:7px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 6px;transition:background .2s}
.shhead.pulling .grab{background:var(--brand)}
.shbar{display:flex;align-items:center;gap:8px;padding:2px 0 12px}
.shttl{flex:1;font-size:17px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shx,.shback{width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:var(--card2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .14s var(--ez)}
.shx:active,.shback:active{transform:scale(.9)}
.shbody{padding-bottom:4px}
.sh-t{font-size:13px;color:var(--ink2);margin-bottom:12px}

/* กลุ่มในชีต */
.grp{border-radius:18px;padding:13px;margin-bottom:12px;background:var(--card2);border:1.5px solid var(--line)}
.grp.plain{background:var(--card);border-style:dashed}
.grp-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.grp-n{width:20px;height:20px;border-radius:7px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;font-family:"Kanit",sans-serif}
.grp-h .r{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}

/* ---------- เสียง ---------- */
.hear{padding:6px 0 14px;min-height:132px;display:flex;flex-direction:column;justify-content:center}
.heard{font-family:"Kanit",sans-serif;font-size:24px;font-weight:500;line-height:1.35;min-height:62px}
.heard.dim{color:var(--ink3)}
.eq{display:flex;align-items:flex-end;gap:5px;height:26px;margin-top:12px}
.eq i{width:4px;background:var(--out);border-radius:2px;height:6px;animation:eq .85s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.1s}.eq i:nth-child(3){animation-delay:.2s}
.eq i:nth-child(4){animation-delay:.3s}.eq i:nth-child(5){animation-delay:.4s}
@keyframes eq{0%,100%{height:6px}50%{height:25px}}
.diag{font-size:11px;color:var(--ink3);margin-top:10px}
.micbig{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:15.5px;font-weight:600;
  box-shadow:0 10px 20px -11px var(--brand);transition:transform .14s var(--ez)}
.micbig:active{transform:scale(.97)}
.micbig.stop{background:linear-gradient(135deg,var(--out2),var(--out))}
.ready{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:10px}
.ready .cd{font-family:"Kanit",sans-serif;font-size:15px;font-weight:600;color:var(--brand)}

/* ตะกร้ารายการที่ยังไม่บันทึก */
.bask{border-radius:18px;border:1.5px solid var(--line);overflow:hidden;margin-bottom:12px}
.bask-h{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--card2);font-size:12.5px;font-weight:600;color:var(--ink2)}
.bask-h .r{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}
.brow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1.5px solid var(--line);width:100%;text-align:left;background:var(--card)}
.brow .bi{flex:0 0 30px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:"Kanit",sans-serif;font-size:13px}
.brow .bn{flex:1;min-width:0}
.brow .bn .a{display:block;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bn .b{display:block;font-size:11px;color:var(--ink3)}

  if(typeof d.opening!=='number')d.opening=0;

    d.cats[t].forEach(function(c,i){
      if(!c.c){var def=(t==='out'?DEF_OUT:DEF_IN).filter(function(x){return x.n===c.n;})[0];
        c.c=def?def.c:SWATCH[i%SWATCH.length];}

function fmt(n){n=Math.round((Number(n)||0)*100)/100;
  var s=Math.abs(n).toFixed(Math.abs(n)%1?2:0).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (n<0?'-':'')+s;}
function fmtK(n){n=Math.abs(Number(n)||0);
  if(n>=1000000)return (n/1000000).toFixed(1).replace(/\.0$/,'')+'ล';
  if(n>=1000)return (n/1000).toFixed(n>=10000?0:1).replace(/\.0$/,'')+'พ';return String(Math.round(n));}
function dkey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function today(){return dkey(new Date());}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function thDate(k){
  var dt=parseKey(k),t=today();
  if(k===t)return 'วันนี้';
  var y=new Date();y.setDate(y.getDate()-1);
  if(k===dkey(y))return 'เมื่อวาน';
  return DAYS[dt.getDay()]+' '+dt.getDate()+' '+MTHS[dt.getMonth()]+' '+((dt.getFullYear()+543)%100);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var TD={'ศูนย์':0,'หนึ่ง':1,'เอ็ด':1,'สอง':2,'ยี่':2,'สาม':3,'สี่':4,'ห้า':5,'หก':6,'เจ็ด':7,'แปด':8,'เก้า':9};
var TU={'สิบ':10,'ร้อย':100,'พัน':1000,'หมื่น':10000,'แสน':100000,'ล้าน':1000000};
function thaiNum(txt){
  var tot=0,cur=0,i=0,found=false;
  while(i<txt.length){
    var hit=false;
    for(var w in TU){if(txt.substr(i,w.length)===w){
      var d=cur||1;if(w==='ล้าน'){tot=(tot+d)*1;tot=tot*1000000;cur=0;}else{tot+=d*TU[w];cur=0;}
      found=true;hit=true;i+=w.length;break;}}
    if(hit)continue;
    for(var t in TD){if(txt.substr(i,t.length)===t){cur=TD[t];found=true;hit=true;i+=t.length;break;}}
    if(hit)continue;
    i++;
  }
  if(!found)return null;
  return tot+cur;
}
function parseSay(raw){
  var s=String(raw||'').replace(/,/g,' ').trim();
  var type='out';
  if(/ได้รับ|รับเงิน|ได้เงิน|ขายได้|เงินเดือน|โอนเข้า|ได้มา|รายรับ|เข้ามา/.test(s))type='in';
  if(/จ่าย|ซื้อ|เสีย|ค่า/.test(s)&&!/ได้รับ|ขายได้|เงินเดือน/.test(s))type='out';
  var amt=null,m=s.match(/(\d+(?:\.\d+)?)\s*(?:บาท|฿)/);
  if(m)amt=parseFloat(m[1]);
  if(amt===null){var all=s.match(/\d+(?:\.\d+)?/g);if(all&&all.length)amt=parseFloat(all[all.length-1]);}
  if(amt===null){var t=thaiNum(s);if(t!==null&&t>0)amt=t;}
  var name=s.replace(/\d+(?:\.\d+)?/g,' ').replace(/บาท|฿|ถ้วน/g,' ')
            .replace(/^(จ่าย|ซื้อ|ได้รับ|รับ|เสีย)\s*/,'').replace(/\s+/g,' ').trim();
  if(!name)name=s.trim();
  return {name:name,amount:(amt===null?'':amt),type:type,cat:''};
}
/* ตัดประโยคยาวเป็นหลายรายการ เช่น "ค่าข้าว 50 ค่าน้ำมัน 100" */
function splitSay(raw){
  var s=String(raw||'').replace(/,/g,' ').replace(/\s+/g,' ').trim();
  var parts=s.split(/(?:\s+(?:แล้วก็|และ|กับ|อีก)\s+)/).filter(function(x){return x.trim();});
  var out=[];
  parts.forEach(function(p){
    var re=/([^\d]+?)\s*(\d+(?:\.\d+)?)\s*(?:บาท|฿)?/g,mm,any=false;
    while((mm=re.exec(p))!==null){
      var nm=mm[1].replace(/^(จ่าย|ซื้อ|ได้รับ|รับ|เสีย)\s*/,'').trim();
      if(!nm)continue;
      any=true;out.push(parseSay(nm+' '+mm[2]+' บาท'));
    }
    if(!any&&p.trim())out.push(parseSay(p));
  });
  return out.length?out:[parseSay(s)];
}
function learnKey(n){return String(n||'').replace(/\s+/g,'').toLowerCase();}
function guessCat(text,type){
  var s=String(text||'').toLowerCase().replace(/\s+/g,'');
  var L=D.learned[learnKey(text)];
  if(L&&L.cat){var arr0=D.cats[L.type||type]||[];for(var q=0;q<arr0.length;q++)if(arr0[q].n===L.cat)return L.cat;}
  var arr=D.cats[type]||[],best='',bl=0;
  for(var i=0;i<arr.length;i++)for(var j=0;j<arr[i].w.length;j++){
    var w=arr[i].w[j].toLowerCase().replace(/\s+/g,'');
    if(w&&s.indexOf(w)>=0&&w.length>bl){bl=w.length;best=arr[i].n;}}
  return best||arr[arr.length-1].n;
}
function balance(){var b=D.opening;for(var i=0;i<D.entries.length;i++){var e=D.entries[i];b+=e.type==='in'?e.amount:-e.amount;}return b;}
function monthOf(k){return k.slice(0,7);}
function sumMonth(ym){var r={'in':0,out:0};
  D.entries.forEach(function(e){if(monthOf(e.date)===ym)r[e.type]+=e.amount;});return r;}
function byDay(list){var g={},keys=[];
  list.forEach(function(e){if(!g[e.date]){g[e.date]=[];keys.push(e.date);}g[e.date].push(e);});return {g:g,keys:keys};}
function weekStart(dt){var d=new Date(dt);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;}
function sortEntries(a){return a.slice().sort(function(x,y){return x.date<y.date?1:(x.date>y.date?-1:(x.id<y.id?1:-1));});}
function streakDays(){
  if(!D.entries.length)return 0;
  var set={};D.entries.forEach(function(e){set[e.date]=1;});
  var n=0,d=new Date();
  if(!set[dkey(d)])d.setDate(d.getDate()-1);
  while(set[dkey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}

var chRange='day14',chShow='both',chSel=-1;
function buildChart(){
  var out=[],n,i,d,k,g={};
  D.entries.forEach(function(e){
    if(!g[e.date])g[e.date]={'in':0,out:0};
    g[e.date][e.type]+=e.amount;});
  if(chRange==='day14'){
    n=14;
    for(i=n-1;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);k=dkey(d);
      out.push({lab:d.getDate()+'',full:thDate(k),'in':(g[k]?g[k]['in']:0),out:(g[k]?g[k].out:0)});}
  }else if(chRange==='wk8'){
    n=8;
    for(i=n-1;i>=0;i--){
      var ws=weekStart(new Date());ws.setDate(ws.getDate()-i*7);
      var we=new Date(ws);we.setDate(we.getDate()+6);
      var si=0,so=0;
      for(var x=new Date(ws);x<=we;x.setDate(x.getDate()+1)){var kk=dkey(x);if(g[kk]){si+=g[kk]['in'];so+=g[kk].out;}}
      out.push({lab:ws.getDate()+'/'+(ws.getMonth()+1),full:'สัปดาห์ '+ws.getDate()+' '+MTHS[ws.getMonth()],'in':si,out:so});}
  }else{
    n=6;
    for(i=n-1;i>=0;i--){
      var dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()-i);
      var ym=dkey(dt).slice(0,7),s=sumMonth(ym);
      out.push({lab:MTHS[dt.getMonth()],full:MTH[dt.getMonth()]+' '+((dt.getFullYear()+543)%100),'in':s['in'],out:s.out});}
  }
  return out;
}

function renderSummary(){
  var ym=monthOf(today()),by={},tot=0;
  D.entries.forEach(function(e){
    if(monthOf(e.date)!==ym||e.type!=='out')return;
    by[e.cat]=(by[e.cat]||0)+e.amount;tot+=e.amount;});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});
  document.getElementById('sumSub').textContent=MTH[+ym.slice(5,7)-1];
  if(!ks.length){document.getElementById('sumBody').innerHTML='<div class="empty" style="padding:10px 4px">เดือนนี้ยังไม่มีรายจ่าย</div>';return;}
  var C=2*Math.PI*38,off=0,segs='';
  ks.forEach(function(k){
    var frac=by[k]/tot,len=Math.max(0,C*frac-Math.min(4,C*.012));
    segs+='<circle cx="55" cy="55" r="38" fill="none" stroke="'+catColor(k,'out')+'" stroke-width="15" '
      +'stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"></circle>';
    off+=C*frac;});
  var rows=ks.slice(0,5).map(function(k){
    return '<div class="crow"><span class="dot" style="background:'+catColor(k,'out')+'"></span>'
     +'<span class="cnm">'+esc(k)+'</span><span class="cpc">'+fmt(by[k])+' · '+Math.round(by[k]/tot*100)+'%</span></div>';}).join('');
  document.getElementById('sumBody').innerHTML=
   '<div class="headline">เดือนนี้หนักไปทาง <b>'+esc(ks[0])+'</b><br><span class="big" style="color:'+catColor(ks[0],'out')+'">'+fmt(by[ks[0]])+'</span> <span style="color:var(--ink2);font-size:13px">จากทั้งหมด '+fmt(tot)+'</span></div>'
   +'<div class="donutwrap"><div class="donut"><svg width="110" height="110">'
   +'<circle cx="55" cy="55" r="38" fill="none" stroke="var(--line)" stroke-width="15"></circle>'+segs+'</svg>'
   +'<div class="mid"><div class="m1">จ่ายรวม</div><div class="m2">'+fmtK(tot)+'</div></div></div>'
   +'<div class="catlist">'+rows+'</div></div>';
}

function countUp(el,from,to){
  if(from===to){el.innerHTML='<span class="bt">฿</span>'+fmt(to);return;}
  var t0=null,dur=560;
  function step(ts){if(!t0)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),v=from+(to-from)*(1-Math.pow(1-k,3));
    el.innerHTML='<span class="bt">฿</span>'+fmt(Math.round(v));
    if(k<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

var sheetStack=[],curSheet='',_popping=false,_histOn=false;
function paint(title,html,noBack){
  document.getElementById('shTtl').textContent=title||'';
  document.getElementById('shBody').innerHTML=html;

function sheetOpen(fn){var t=document.getElementById('toast');t.classList.remove('on');sheetStack=[fn];fn();}
function sheetPush(fn){sheetStack.push(fn);fn();}
function sheetBack(){
  if(sheetStack.length<2){closeSheet();return;}

}
function sheetDirty(){
  if(curSheet==='form'&&!editId&&draft)
    return !!((draft.name&&draft.name.trim())||(draft.amount!==''&&!isNaN(draft.amount)));
  if(curSheet==='quick'&&quick)return quick.picked.length>0;

}
function closeSheet(force){
  if(!force&&sheetDirty()){
    askConfirm('ทิ้งที่กรอกไว้?','ยังไม่ได้กดบันทึก ปิดแล้วที่กรอกไว้จะหายไป','ทิ้งเลย',function(){closeSheet(true);},true);
    return;
  }
  stopRec();
  var sh=document.getElementById('sheet');
  sh.classList.remove('drag');sh.style.transform='';
  sh.classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  var was=curSheet;

  if(_histOn&&!_popping){try{history.back();}catch(e){}_histOn=false;}
  _histOn=false;
}
function rePush(){try{history.pushState({sheet:1},'');_histOn=true;}catch(e){}}
window.addEventListener('popstate',function(){
  _histOn=false;
  if(document.getElementById('ask').classList.contains('on')){askClose(false);rePush();return;}

/* ลากแถบขีดลงเพื่อปิด */
(function(){
  var head=document.getElementById('shHead'),sh=document.getElementById('sheet');
  var y0=0,dy=0,on=false;
  head.addEventListener('touchstart',function(e){
    on=true;dy=0;y0=e.touches[0].clientY;sh.classList.add('drag');head.classList.add('pulling');},{passive:true});
  head.addEventListener('touchmove',function(e){
    if(!on)return;
    dy=e.touches[0].clientY-y0;
    if(dy<0)dy=dy/4;
    sh.style.transform='translateY('+dy+'px)';},{passive:true});
  head.addEventListener('touchend',function(){
    if(!on)return;on=false;
    sh.classList.remove('drag');head.classList.remove('pulling');
    if(dy>90){sh.style.transform='';closeSheet();}
    else sh.style.transform='';},{passive:true});
})();

function calGrid(ym,sel,pickFn,shiftFn){
  var y=+ym.slice(0,4),m=+ym.slice(5,7);
  var first=new Date(y,m-1,1),start=first.getDay(),days=new Date(y,m,0).getDate();
  var prevDays=new Date(y,m-1,0).getDate(),t=today();
  var h='<div class="cal"><div class="cal-h"><button class="tap" onclick="'+shiftFn+'(-1)" aria-label="เดือนก่อน">‹</button>'
   +'<span class="cm">'+MTH[m-1]+' '+(y+543)+'</span>'
   +'<button class="tap" onclick="'+shiftFn+'(1)" aria-label="เดือนถัดไป">›</button></div><div class="cal-g">';
  DAYS1.forEach(function(d){h+='<div class="wd">'+d+'</div>';});
  var i,k;
  for(i=0;i<start;i++)h+='<div class="cal-d mut">'+(prevDays-start+i+1)+'</div>';
  for(i=1;i<=days;i++){
    k=y+'-'+String(m).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    h+='<button class="cal-d'+(k===sel?' on':'')+(k===t&&k!==sel?' tod':'')+(k>t?' fut':'')+'" onclick="'+pickFn+'(\''+k+'\')">'+i+'</button>';}
  var tail=(start+days)%7;

  return h+'</div></div>';
}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,draft=null,editId=null,quick=null,recTimer=null,readyTimer=null;
var voice={state:'idle',text:'',msg:'',code:'',to:'basket'};
function stopRec(){
  clearTimeout(recTimer);clearTimeout(readyTimer);
  if(rec){try{rec.onend=null;rec.onresult=null;rec.onerror=null;rec.abort();}catch(e){}rec=null;}
  var s=document.getElementById('sayBtn');if(s)s.classList.remove('live');
  if(voice.state==='listening'||voice.state==='ready')voice.state='idle';
}
/* เริ่มฟัง: หน่วง 1.2 วิ ให้ตั้งตัวก่อน (เดิมฟังทันทีจนพูดไม่ทัน) แล้วฟังยาว 15 วิ */
function startListen(to,onDone){
  stopRec();
  voice.to=to||'basket';voice.text='';voice.msg='';voice.code='';
  if(!SR){voice.state='fail';voice.msg='เบราว์เซอร์นี้ไม่รองรับการพูด ใช้ Chrome หรือพิมพ์เอาก็ได้';voice.code='no-api';onDone();return;}
  voice.state='ready';onDone();
  var n=3;
  readyTimer=setInterval(function(){
    n--;var el=document.getElementById('cdNum');
    if(el)el.textContent=n>0?n:'พูดได้เลย';
    if(n<=0){clearInterval(readyTimer);realStart(onDone);}
  },400);
}
function realStart(onDone){
  var got='',fin='';
  try{
    rec=new SR();
    rec.lang='th-TH';rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
    voice.state='listening';voice.text='';onDone();
    var s=document.getElementById('sayBtn');if(s)s.classList.add('live');
    rec.onstart=function(){clearTimeout(recTimer);recTimer=setTimeout(function(){if(rec){try{rec.stop();}catch(e){}}},15000);};
    rec.onresult=function(ev){
      var it='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        if(ev.results[i].isFinal)fin+=ev.results[i][0].transcript;else it+=ev.results[i][0].transcript;}
      got=(fin+it).trim();voice.text=got;
      var h=document.getElementById('heard');
      if(h){h.textContent=got||'กำลังฟัง…';h.classList.toggle('dim',!got);}};
    rec.onerror=function(ev){
      var c=ev.error||'unknown';
      voice.code=c;
      voice.msg=(c==='not-allowed'||c==='service-not-allowed')?'เบราว์เซอร์ยังไม่ให้ใช้ไมค์ กดไอคอนข้างช่องที่อยู่เว็บ แล้วเปิดสิทธิ์ไมโครโฟน'
        :c==='no-speech'?'ไม่ได้ยินเสียงเลย ลองพูดใกล้ๆ อีกที'
        :c==='network'?'ต่อบริการแปลงเสียงไม่ได้ ต้องมีเน็ตตอนพูด'
        :c==='audio-capture'?'หาไมโครโฟนไม่เจอ':'ฟังไม่สำเร็จ ลองอีกครั้ง';
      rec=null;clearTimeout(recTimer);
      if(!got){voice.state='fail';onDone();}};
    rec.onend=function(){
      rec=null;clearTimeout(recTimer);
      var s2=document.getElementById('sayBtn');if(s2)s2.classList.remove('live');
      var t=(fin||got).trim();
      if(t){buzz(14);voice.state='idle';voice.text='';gotSpeech(t);}
      else if(voice.state==='listening'){voice.state='fail';voice.msg='ยังไม่ได้ยินอะไร ลองอีกครั้ง';voice.code='empty';onDone();}};
    rec.start();
  }catch(e){voice.state='fail';voice.msg='เริ่มไมค์ไม่ได้ ลองปิดแอปอื่นที่ใช้ไมค์อยู่';voice.code='start-fail';onDone();}
}
function gotSpeech(text){
  var items=splitSay(text);
  if(voice.to==='quick'){
    items.forEach(function(it){
      var cat=guessCat(it.name,'out');
      quick.picked.push({pin:-1,name:it.name,cat:cat,type:'out',amount:(it.amount===''?'':it.amount),pinIt:false});});
    toast('เพิ่ม '+items.length+' รายการจากเสียง','ok');drawQuick();return;
  }
  items.forEach(function(it){
    it.cat=guessCat(it.name,it.type);it.date=today();it.id=uid();
    D.basket.push(it);});
  save();toast(items.length>1?('ได้ยิน '+items.length+' รายการ'):'ได้ยินแล้ว ตรวจดูก่อนบันทึก','ok');
  drawSay();
}

         :{name:(pre&&pre.name)||'',amount:(pre&&pre.amount!=null)?pre.amount:'',type:(pre&&pre.type)||'out',cat:(pre&&pre.cat)||'',date:(pre&&pre.date)||today()};
  draft.mode=mode;draft.bidx=(typeof bidx==='number')?bidx:-1;draft.calOpen=false;draft.calYm=monthOf(draft.date);
  if(!draft.cat)draft.cat=guessCat(draft.name,draft.type);
  if(sheetStack.length)drawForm(!!(pre&&pre.name));
  else sheetOpen(function(){drawForm(!!(pre&&pre.name));});
}
function recentNames(n){
  var seen={},out=[];

  return out.slice(0,n||8);
}

  +'<div class="seg"><button class="'+(draft.type==='out'?'on o':'')+'" onclick="setType(\'out\')">จ่ายออก</button>'
  +'<button class="'+(draft.type==='in'?'on i':'')+'" onclick="setType(\'in\')">รับเข้า</button></div>'
  +'<div class="field"><span class="fl">รายการ</span><input type="text" id="fNm" value="'+esc(draft.name)+'" oninput="onNm(this.value)" autocomplete="off" placeholder="เช่น ค่าข้าว"></div>'

  +'<input type="number" inputmode="decimal" id="fAmt" value="'+(draft.amount===''?'':draft.amount)+'" oninput="onAmt(this.value)" placeholder="0"></div></div>'
  +'<div class="field"><span class="fl">หมวด</span><div class="chipwrap" id="catWrap">'+catChips+'</div></div>'
  +'<div class="field"><span class="fl">วันที่</span><div class="chiprow">'

  +(draft.calOpen?calGrid(draft.calYm,draft.date,'formPickDate','calShiftForm'):'')+'</div>'
  +'<div class="err hide" id="fErr"></div>'
  +'<div class="stick"><button class="btn '+(draft.type==='in'?'btn-in':'btn-main')+'" onclick="saveEntry()">'+okTxt+'</button>'
  +(editId?'<div class="btn-row"><button class="btn btn-out" onclick="pinThis()">ปักหมุดเป็นชิป</button>'

function toggleCal(){draft.calOpen=!draft.calOpen;draft.calYm=monthOf(draft.date);buzz(8);drawForm(false);showCal();}
function showCal(){setTimeout(function(){var c=document.querySelector('.cal');
  if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'});},70);}
function calShiftForm(d){draft.calYm=shiftYM(draft.calYm,d);buzz(8);drawForm(false);showCal();}
function formPickDate(k){draft.date=k;draft.calOpen=false;buzz(10);drawForm(false);}
function pickCat(i){
  draft.cat=D.cats[draft.type][i].n;buzz(8);
  var w=document.getElementById('catWrap').children;
  for(var j=0;j<w.length;j++)w[j].classList.toggle('on',j===i);
}
function pickDate(i){var d=new Date();if(i===1)d.setDate(d.getDate()-1);draft.date=dkey(d);draft.calOpen=false;drawForm(false);buzz(8);}
function useRecent(i){
  var e=window._recent[i];if(!e)return;
  draft.name=e.name;draft.cat=e.cat;draft.type=e.type;
  if(draft.amount===''||draft.amount==null)draft.amount=e.amount;
  buzz(10);drawForm(false);
}
function onNm(v){
  draft.name=v;document.getElementById('pvNm').textContent=v||'—';
  if(!editId){var g=guessCat(v,draft.type);draft.cat=g;
    var w=document.getElementById('catWrap').children,cats=D.cats[draft.type];
    for(var j=0;j<w.length;j++)w[j].classList.toggle('on',cats[j].n===g);}
}
function onAmt(v){
  draft.amount=v===''?'':parseFloat(v);
  var ok=!(draft.amount===''||isNaN(draft.amount)||draft.amount<=0);
  document.getElementById('moneyBox').classList.toggle('filled',ok);
  document.getElementById('pvAmt').textContent=(draft.type==='in'?'+':'−')+(ok?fmt(draft.amount):'0');
}
function setType(t){
  draft.type=t;var cats=D.cats[t],ok=false;
  for(var i=0;i<cats.length;i++)if(cats[i].n===draft.cat)ok=true;
  if(!ok)draft.cat=guessCat(draft.name,t);
  buzz(8);drawForm(false);
}
function saveEntry(){
  var err=document.getElementById('fErr'),amt=parseFloat(draft.amount);
  if(!draft.name||!draft.name.trim()){err.textContent='ยังไม่ได้ใส่ชื่อรายการ';err.classList.remove('hide');return;}
  if(!(amt>0)){err.textContent='ใส่จำนวนเงินที่มากกว่า 0';err.classList.remove('hide');return;}
  var r={id:editId||uid(),name:draft.name.trim(),amount:amt,type:draft.type,cat:draft.cat,date:draft.date||today()};
  if(draft.mode==='basketEdit'){D.basket[draft.bidx]=r;save();buzz(14);sheetBack();drawSay();toast('แก้ '+r.name+' แล้ว','ok');return;}
  if(draft.mode==='basketNew'){D.basket.push(r);save();buzz(14);sheetBack();drawSay();toast('เพิ่ม '+r.name+' เข้ารายการรอบันทึก','ok');return;}
  var was=!!editId;
  if(editId){for(var i=0;i<D.entries.length;i++)if(D.entries[i].id===editId)D.entries[i]=r;}
  else D.entries.push(r);
  D.learned[learnKey(r.name)]={cat:r.cat,type:r.type};
  save();buzz(18);closeSheet(true);render();
  toast(was?('แก้ '+r.name+' แล้ว · '+fmt(amt)):('บันทึก'+(r.type==='in'?'รายรับ ':'รายจ่าย ')+r.name+' '+fmt(amt)+' แล้ว'),'ok');
}
function delEntry(){
  if(!editId)return;
  var e=D.entries.filter(function(x){return x.id===editId;})[0];
  askConfirm('ลบรายการนี้?',(e?e.name+' · '+fmt(e.amount):'')+' ลบแล้วเอากลับไม่ได้','ลบเลย',function(){
    D.entries=D.entries.filter(function(x){return x.id!==editId;});
    save();closeSheet(true);render();toast('ลบ '+(e?e.name:'รายการ')+' แล้ว','del');},true);
}
function pinThis(){
  if(!draft.name)return;
  addPin(draft.name.trim(),draft.cat,draft.type,parseFloat(draft.amount)||0);
  toast('ปักหมุด '+draft.name+' เป็นชิปแล้ว','ok');
}
function addPin(n,cat,type,last){
  for(var i=0;i<D.pins.length;i++)if(learnKey(D.pins[i].n)===learnKey(n)){
    D.pins[i].last=last||D.pins[i].last;D.pins[i].cat=cat||D.pins[i].cat;save();return;}
  D.pins.push({n:n,cat:cat,type:type||'out',last:last||0});save();
}

function qPickDate(k){quick.date=k;quick.calOpen=false;buzz(10);drawQuick();}
function qDate(i){var d=new Date();if(i===1)d.setDate(d.getDate()-1);quick.date=dkey(d);quick.calOpen=false;buzz(8);drawQuick();}
function quickAdd(){
  var v=(quick.nm||'').trim();if(!v){toast('ยังไม่ได้พิมพ์ชื่อของ','del');return;}
  var p=parseSay(v);
  var nm=p.name||v;
  quick.picked.push({pin:-1,name:nm,cat:guessCat(nm,'out'),type:'out',amount:(p.amount===''?'':p.amount),pinIt:false});
  quick.nm='';buzz(10);drawQuick();
  var f=document.getElementById('qNm');if(f)setTimeout(function(){f.focus();},60);
}
function quickMic(){
  if(voice.state==='listening'||voice.state==='ready'){stopRec();quick.micState='';drawQuick();return;}
  startListen('quick',function(){
    quick.micState=voice.state==='ready'?'เตรียมพูด…':(voice.state==='listening'?'กำลังฟัง พูดได้เลย เช่น “หมูสามชั้น 120”':(voice.state==='fail'?voice.msg+(voice.code?' (รหัส: '+voice.code+')':''):''));
    var el=document.getElementById('qMic');if(el)el.classList.toggle('live',voice.state==='listening'||voice.state==='ready');
    drawQuick();});
}
function togglePin(i){
  var at=-1;
  for(var j=0;j<quick.picked.length;j++)if(quick.picked[j].pin===i)at=j;
  if(at>=0)quick.picked.splice(at,1);
  else{var p=D.pins[i];quick.picked.push({pin:i,name:p.n,cat:p.cat,type:p.type||'out',amount:(p.last>0?p.last:''),pinIt:false});}
  buzz(8);drawQuick();
}
function qPin(i){quick.picked[i].pinIt=!quick.picked[i].pinIt;buzz(8);drawQuick();}
function qAmt(i,v){
  if(quick.picked[i])quick.picked[i].amount=v===''?'':parseFloat(v);
  var tot=quick.picked.reduce(function(s,x){var q=parseFloat(x.amount);return s+(q>0?q:0);},0);
  var el=document.getElementById('qTot');if(el)el.textContent='−'+fmt(tot);

function qDel(i){quick.picked.splice(i,1);drawQuick();}
function goManagePins(){var q=quick;quick=null;closeSheet(true);setTimeout(openPins,120);}
function saveQuick(){
  var ok=quick.picked.filter(function(x){return parseFloat(x.amount)>0;});
  if(!ok.length){toast('ยังไม่ได้ใส่ราคาสักอัน','del');return;}
  var d=quick.date||today(),sum=0;
  ok.forEach(function(x){
    var amt=parseFloat(x.amount);sum+=amt;
    D.entries.push({id:uid(),name:x.name,amount:amt,type:x.type||'out',cat:x.cat,date:d});
    if(x.pin>=0&&D.pins[x.pin])D.pins[x.pin].last=amt;
    if(x.pin<0&&x.pinIt)addPin(x.name,x.cat,x.type||'out',amt);
    D.learned[learnKey(x.name)]={cat:x.cat,type:x.type||'out'};});
  quick=null;save();buzz(20);closeSheet(true);render();
  toast('บันทึก '+ok.length+' รายการแล้ว · รวม '+fmt(sum),'ok');
}

   +'<div class="grp" style="margin-top:14px"><div class="grp-h">โหมดกลางคืน<span class="r">ใช้ได้กับทุกธีม</span></div>'
   +'<div class="btn-row" style="margin:0"><button class="btn '+(D.dark?'btn-out':'btn-main')+'" onclick="setDark(false)">กลางวัน</button>'
   +'<button class="btn '+(D.dark?'btn-main':'btn-out')+'" onclick="setDark(true)">กลางคืน</button></div></div>');
}
function pickTheme(id){D.theme=id;save();applyTheme();buzz(12);drawTheme();render();toast('เปลี่ยนเป็นธีม '+themeOf(id).n,'info');}
function setDark(v){D.dark=!!v;save();applyTheme();buzz(10);drawTheme();render();}

/* ---- เงินตั้งต้น ---- */
function openOpening(){sheetOpen(drawOpening);}
function drawOpening(){
  curSheet='opening';
  paint('เงินตั้งต้น','<div class="sh-t">ยอดคงเหลือ = เงินตั้งต้น + รับทั้งหมด − จ่ายทั้งหมด</div>'
   +'<div class="field"><span class="fl">เงินที่มีอยู่ก่อนเริ่มใช้แอป</span>'
   +'<div class="money filled"><span class="cur">฿</span><input type="number" inputmode="decimal" id="openBal" value="'+D.opening+'"></div></div>'
   +'<button class="btn btn-main" onclick="saveOpening()">บันทึกเงินตั้งต้น</button>');
}
function saveOpening(){
  var v=parseFloat(document.getElementById('openBal').value);
  D.opening=isNaN(v)?0:v;save();_lastBal=null;closeSheet(true);render();toast('บันทึกเงินตั้งต้น '+fmt(D.opening)+' แล้ว','ok');
}

/* ---- หมวด / ชิป ---- */
var curCatType='out';
function openCats(t){curCatType=t;sheetOpen(drawCatList);}
function drawCatList(){
  curSheet='cats';
  var arr=D.cats[curCatType];
  var rows=arr.map(function(c,i){
    var used=D.entries.filter(function(e){return e.cat===c.n&&e.type===curCatType;}).length;
    return '<button class="setrow" onclick="editCat(\''+curCatType+'\','+i+')">'
     +'<span class="dot" style="background:'+c.c+';width:14px;height:14px;flex:0 0 14px"></span>'
     +'<span class="cn">'+esc(c.n)+'</span><span class="go">'+(used?used+' รายการ ':'')+'›</span></button>';}).join('');
  paint(curCatType==='out'?'หมวดรายจ่าย':'หมวดรายรับ',
   '<div class="grp">'+rows+'</div>'
   +'<button class="btn btn-out" onclick="editCat(\''+curCatType+'\',-1)">+ เพิ่มหมวดใหม่</button>');
}
function openPins(){sheetOpen(drawPinList);}
function drawPinList(){
  curSheet='pins';
  var rows=D.pins.length?D.pins.map(function(p,i){
    return '<button class="setrow" onclick="editPin('+i+')">'
     +'<span class="dot" style="background:'+catColor(p.cat,p.type||'out')+';width:14px;height:14px;flex:0 0 14px"></span>'
     +'<span class="cn">'+esc(p.n)+'<span style="color:var(--ink3);font-size:11.5px"> · '+esc(p.cat)+(p.last>0?' · '+fmt(p.last):'')+'</span></span>'
     +'<span class="go">›</span></button>';}).join('')
   :'<div class="hintline">ยังไม่มีชิป ชิปคือของที่ซื้อบ่อย เอาไว้กดแล้วใส่ราคาได้เลยตอนจดหลายรายการ</div>';
  paint('ชิปซื้อประจำ','<div class="grp">'+rows+'</div>'
   +'<button class="btn btn-out" onclick="editPin(-1)">+ เพิ่มชิปใหม่</button>');
}
var edit=null;
function editPin(i){
  var p=i>=0?D.pins[i]:null;
  edit={kind:'pin',idx:i,n:p?p.n:'',cat:p?p.cat:D.cats.out[0].n,type:p?(p.type||'out'):'out',last:p?(p.last||0):0};
  sheetPush(drawEdit);
}
function editCat(t,i){
  var c=i>=0?D.cats[t][i]:null;
  edit={kind:'cat',type:t,idx:i,n:c?c.n:'',c:c?c.c:SWATCH[D.cats[t].length%SWATCH.length]};
  sheetPush(drawEdit);
}
function drawEdit(){
  curSheet='edit';
  if(edit.kind==='cat'){
    var sw=SWATCH.map(function(c,i){
      return '<button class="sw'+(c===edit.c?' on':'')+'" style="background:'+c+'" onclick="pickSw('+i+')" aria-label="สี'+(i+1)+'"></button>';}).join('');
    paint(edit.idx<0?'เพิ่มหมวดใหม่':'แก้หมวด',
      '<div class="field"><span class="fl">ชื่อหมวด</span><input type="text" id="eNm" value="'+esc(edit.n)+'" oninput="edit.n=this.value"></div>'
     +'<div class="field"><span class="fl">สีประจำหมวด</span><div class="swatches">'+sw+'</div></div>'
     +'<button class="btn btn-main" onclick="saveEdit()">บันทึก</button>'
     +(edit.idx>=0&&D.cats[edit.type].length>1?'<div class="btn-row"><button class="btn btn-danger" onclick="removeEdit()">ลบหมวดนี้</button></div>':''));
    return;
  }
  var cats=D.cats[edit.type];
  var chips=cats.map(function(c,i){
    return '<button class="chip'+(c.n===edit.cat?' on':'')+'" onclick="pickEditCat('+i+')">'
     +'<span class="dot" style="background:'+c.c+'"></span>'+esc(c.n)+'</button>';}).join('');
  paint(edit.idx<0?'เพิ่มชิปใหม่':'แก้ชิป',
   '<div class="field"><span class="fl">ชื่อของที่ซื้อประจำ</span><input type="text" id="eNm" value="'+esc(edit.n)+'" oninput="edit.n=this.value" placeholder="เช่น ค่าข้าว, ค่าน้ำมัน"></div>'
   +'<div class="seg"><button class="'+(edit.type==='out'?'on o':'')+'" onclick="setEditType(\'out\')">จ่ายออก</button>'
   +'<button class="'+(edit.type==='in'?'on i':'')+'" onclick="setEditType(\'in\')">รับเข้า</button></div>'
   +'<div class="field"><span class="fl">หมวด</span><div class="chipwrap">'+chips+'</div></div>'
   +'<div class="field"><span class="fl">ราคาที่ใช้บ่อย (ใส่หรือไม่ใส่ก็ได้)</span>'
   +'<div class="money'+(edit.last>0?' filled':'')+'"><span class="cur">฿</span>'
   +'<input type="number" inputmode="decimal" id="eLast" value="'+(edit.last||'')+'" oninput="edit.last=parseFloat(this.value)||0"></div></div>'
   +'<button class="btn btn-main" onclick="saveEdit()">บันทึก</button>'
   +(edit.idx>=0?'<div class="btn-row"><button class="btn btn-danger" onclick="removeEdit()">ลบชิปนี้</button></div>':''));
}
function pickSw(i){edit.c=SWATCH[i];buzz(8);drawEdit();}
function pickEditCat(i){edit.cat=D.cats[edit.type][i].n;buzz(8);drawEdit();}
function setEditType(t){edit.type=t;edit.cat=D.cats[t][0].n;buzz(8);drawEdit();}
function saveEdit(){
  var n=(edit.n||'').trim();
  if(!n){toast('ยังไม่ได้ใส่ชื่อ','del');return;}
  if(edit.kind==='cat'){
    var arr=D.cats[edit.type];
    for(var i=0;i<arr.length;i++)if(arr[i].n===n&&i!==edit.idx){toast('มีหมวดชื่อนี้แล้ว','del');return;}
    if(edit.idx<0){arr.splice(Math.max(0,arr.length-1),0,{n:n,c:edit.c,w:[n]});save();sheetBack();render();toast('เพิ่มหมวด '+n+' แล้ว','ok');return;}
    var old=arr[edit.idx].n;
    arr[edit.idx].n=n;arr[edit.idx].c=edit.c;
    if(old!==n){
      D.entries.forEach(function(e){if(e.cat===old&&e.type===edit.type)e.cat=n;});
      D.basket.forEach(function(e){if(e.cat===old&&e.type===edit.type)e.cat=n;});
      D.pins.forEach(function(p){if(p.cat===old)p.cat=n;});
      for(var k in D.learned)if(D.learned.hasOwnProperty(k)&&D.learned[k].cat===old)D.learned[k].cat=n;}
    save();sheetBack();render();toast('แก้หมวดเป็น '+n+' แล้ว','ok');return;
  }
  if(edit.idx<0){
    for(var j=0;j<D.pins.length;j++)if(learnKey(D.pins[j].n)===learnKey(n)){toast('มีชิปชื่อนี้แล้ว','del');return;}
    D.pins.push({n:n,cat:edit.cat,type:edit.type,last:edit.last||0});
    save();sheetBack();render();toast('เพิ่มชิป '+n+' แล้ว','ok');return;}
  D.pins[edit.idx]={n:n,cat:edit.cat,type:edit.type,last:edit.last||0};
  save();sheetBack();render();toast('แก้ชิปเป็น '+n+' แล้ว','ok');
}
function removeEdit(){
  if(edit.kind==='cat'){
    var arr=D.cats[edit.type],c=arr[edit.idx];
    var used=D.entries.filter(function(e){return e.cat===c.n&&e.type===edit.type;}).length;
    var fall=arr[arr.length-1].n;
    if(fall===c.n)fall=arr.length>1?arr[arr.length-2].n:'อื่นๆ';
    askConfirm('ลบหมวด '+c.n+'?',used?('มี '+used+' รายการในหมวดนี้ ลบแล้วจะย้ายไปหมวด “'+fall+'”'):'ลบหมวดนี้ออกจากรายการ','ลบเลย',function(){
      D.entries.forEach(function(e){if(e.cat===c.n&&e.type===edit.type)e.cat=fall;});
      D.pins.forEach(function(p){if(p.cat===c.n)p.cat=fall;});
      arr.splice(edit.idx,1);save();sheetBack();render();toast('ลบหมวด '+c.n+' แล้ว','del');},true);
    return;
  }
  var p=D.pins[edit.idx];
  askConfirm('ลบชิป '+p.n+'?','รายการที่บันทึกไปแล้วยังอยู่เหมือนเดิม','ลบเลย',function(){
    D.pins.splice(edit.idx,1);save();sheetBack();render();toast('ลบชิป '+p.n+' แล้ว','del');},true);
}

/* ---- สำรองข้อมูล / คำที่จำได้ / ล้างข้อมูล ---- */
function openBackup(){sheetOpen(drawBackup);}
function drawBackup(){
  curSheet='backup';
  paint('สำรองข้อมูล',
   '<div class="hintline" style="margin-bottom:14px">'+(D.backupAt?('สำรองล่าสุด '+thDate(dkey(new Date(D.backupAt)))):'ยังไม่เคยสำรองข้อมูลเลย')
   +' · ตอนนี้มี '+D.entries.length+' รายการ</div>'
   +'<button class="btn btn-main" onclick="doExport()">บันทึกไฟล์สำรองลงเครื่อง</button>'
   +'<div class="btn-row"><button class="btn btn-out" onclick="document.getElementById(\'impFile\').click()">นำไฟล์กลับเข้ามา</button></div>'
   +'<input type="file" id="impFile" accept="application/json,.json" class="hide" onchange="doImport(this)">'
   +'<div class="hintline" style="margin-top:14px">ข้อมูลอยู่ในเครื่องนี้เครื่องเดียว ถ้าล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหายโดยไม่เตือน สำรองไฟล์ไว้เดือนละครั้งกำลังดี</div>');
}
function openLearned(){sheetOpen(drawLearned);}
function drawLearned(){
  curSheet='learned';
  var ks=Object.keys(D.learned);
  var rows=ks.length?ks.slice(0,60).map(function(k){
    var v=D.learned[k];
    return '<div class="setrow"><span class="dot" style="background:'+catColor(v.cat,v.type||'out')+';width:12px;height:12px;flex:0 0 12px"></span>'
     +'<span class="cn">'+esc(k)+'</span><span class="go">'+esc(v.cat)+'</span></div>';}).join('')
   :'<div class="hintline">ยังไม่มี เมื่อไหร่ที่คุณแก้หมวดที่แอปเดาผิด มุ่ยเฟยจะจำคำนั้นไว้</div>';
  paint('คำที่แอปจำได้','<div class="grp">'+rows+'</div>'
   +(ks.length?'<button class="btn btn-danger" onclick="clearLearned()">ล้างคำที่จำไว้ทั้งหมด</button>':''));
}
function clearLearned(){
  askConfirm('ล้างคำที่จำไว้?','แอปจะกลับไปเดาหมวดจากคำพื้นฐานเหมือนตอนเริ่มใช้','ล้างเลย',function(){
    var n=Object.keys(D.learned).length;
    D.learned={};save();drawLearned();renderSet();toast('ล้างคำที่จำไว้ '+n+' คำแล้ว','del');},true);
}
function doExport(){
  var blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muifei-'+today()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},800);
  D.backupAt=Date.now();save();render();drawBackup();toast('บันทึกไฟล์สำรองแล้ว','ok');
}
function doImport(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.entries))throw new Error('bad');
      askConfirm('นำเข้า '+o.entries.length+' รายการ?','ข้อมูลตอนนี้ '+D.entries.length+' รายการจะถูกทับทั้งหมด','นำเข้าเลย',function(){
        D=Object.assign(load(),o);save();_lastBal=null;applyTheme();closeSheet(true);render();
        toast('นำเข้า '+o.entries.length+' รายการแล้ว','ok');},true);
    }catch(e){toast('ไฟล์นี้อ่านไม่ได้ ต้องเป็นไฟล์ที่กดสำรองจากแอปนี้','del');}
    inp.value='';};
  r.readAsText(f);
}
function wipeAll(){
  askConfirm('ลบรายการทั้งหมด?','มี '+D.entries.length+' รายการ ลบแล้วเอากลับไม่ได้ ถ้ายังไม่ได้สำรองไฟล์ กดยกเลิกก่อน','ลบทั้งหมด',function(){
    askConfirm('แน่ใจอีกครั้ง','กดยืนยันแล้วรายการทั้งหมดจะหายทันที','ยืนยันลบ',function(){
      var n=D.entries.length;
      D.entries=[];D.basket=[];save();_lastBal=null;render();toast('ลบรายการทั้งหมด '+n+' รายการแล้ว','del');},true);},true);
}
function finishFirst(skip){
  var v=skip?0:parseFloat(document.getElementById('firstBal').value);
  D.opening=isNaN(v)?0:v;D.setup=true;save();
  document.getElementById('first').classList.add('hide');
  render();toast('เริ่มใช้มุ่ยเฟยได้เลย','ok');
}

/* ================= เริ่มทำงาน ================= */
document.getElementById('askOk').onclick=function(){askClose(true);};
document.getElementById('askNo').onclick=function(){askClose(false);};
document.getElementById('ask').onclick=function(e){if(e.target===this)askClose(false);};
applyTheme();
goTab('home');
if(!D.setup)document.getElementById('first').classList.remove('hide');
</script>
